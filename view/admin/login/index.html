<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>管理员登录</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    
    <!-- 引入外部资源 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../template/CDN/all.min.css">
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="{__LIBS__}layui/css/layui.css"/>
    
    <!-- Tailwind 配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2E5BFF', // 匹配设计图主蓝色
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <!-- 自定义工具类 -->
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .input-focus {
                @apply focus:border-primary focus:ring-2 focus:ring-primary/20 focus:outline-none transition-all;
            }
            .btn-effect {
                @apply transition-all hover:shadow-lg transform hover:-translate-y-0.5 active:translate-y-0;
            }
        }
    </style>
    
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: #C9CAD0; /* 匹配设计图浅灰色背景 */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        /* 加载动画 */
        .loader {
            border-top-color: #2E5BFF;
            animation: spinner 0.8s linear infinite;
        }
        
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body class="p-4">
    <!-- 主登录卡片：左右分栏布局 -->
    <div class="w-full max-w-4xl bg-white rounded-lg shadow-xl overflow-hidden flex flex-col md:flex-row">
        <!-- 左侧：登录表单区域 -->
        <div class="w-full md:w-1/2 p-8 flex flex-col items-center">
            <!-- Logo -->
            <img src="{__IMG__}logo.png" alt="系统Logo" class="w-16 h-16 mb-6">
            <!-- 标题 -->
            <h2 class="text-2xl font-bold text-primary mb-6">管理员登录</h2>
            <!-- 登录表单 -->
            <form class="w-full max-w-sm" id="loginForm">
                <!-- 用户名输入 -->
                <div class="relative mb-4">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center">
                        <i class="fa fa-user text-gray-400"></i>
                    </div>
                    <input class="w-full pl-10 py-3 border border-gray-300 rounded-lg input-focus" 
                           name="user" placeholder="请输入用户名" autocomplete="off"
                           lay-verType="tips" lay-verify="required">
                </div>
                <!-- 密码输入 -->
                <div class="relative mb-6">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center">
                        <i class="fa fa-lock text-gray-400"></i>
                    </div>
                    <input class="w-full pl-10 py-3 border border-gray-300 rounded-lg input-focus" 
                           name="pass" placeholder="请输入密码" type="password"
                           lay-verType="tips" lay-verify="required">
                </div>
                <!-- 记住密码 -->
                <div class="flex items-center mb-6">
                    <input type="checkbox" name="remember" title="记住密码" lay-skin="primary" checked class="mr-2">
                    <label class="text-sm text-gray-600">记住密码</label>
                </div>
                <!-- 登录按钮 -->
                <button type="button" id="loginBtn" class="w-full bg-gradient-to-r from-primary to-blue-800 text-white font-medium py-3 px-4 rounded-lg btn-effect">
                    登录系统
                </button>
            </form>
            <!-- 底部辅助链接 -->
            <div class="mt-6 flex space-x-4">
                <a href="/" class="text-primary hover:text-blue-800 text-sm">返回首页</a>
                <a href="/index/login" class="text-primary hover:text-blue-800 text-sm">用户登录</a>
            </div>
        </div>
        
        <!-- 右侧：系统介绍区域 -->
        <div class="w-full md:w-1/2 bg-primary text-white p-8 flex flex-col items-center justify-center">
            <h2 class="text-2xl font-bold mb-2">浪人解析计费系统</h2>
            <p class="text-center text-blue-100 mb-6">专业的多功能解析计费系统，提供高效稳定的解析服务</p>
            <div class="flex space-x-4 mb-4">
              <a href="//auth.cn/#products" style="text-decoration: none; color: inherit;">
  <button class="bg-transparent border border-white text-white px-4 py-2 rounded-lg hover:bg-white/10 transition-all">
    系统介绍
  </button>
</a>
  <a href="//auth.cn/#auth" style="text-decoration: none; color: inherit;">
                <button class="bg-transparent border border-white text-white px-4 py-2 rounded-lg hover:bg-white/10 transition-all">授权验证 </button>
                </a>
            </div>
            <p class="text-blue-100 text-sm">当前版本: v1.0</p>
        </div>
    </div>
    
    <!-- 加载指示器（默认隐藏） -->
    <div id="loadingIndicator" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden">
        <div class="bg-white p-6 rounded-lg shadow-lg flex items-center">
            <div class="loader w-6 h-6 border-2 border-gray-300 rounded-full mr-3"></div>
            <span>登录中，请稍候...</span>
        </div>
    </div>

    <!-- 底部版权信息 -->
    <p class="text-center text-gray-500 text-sm mt-8">
        © 2025 浪人解析计费系统. All Rights Reserved.
    </p>

    <!-- 脚本：保留原登录功能逻辑 -->
    <script type="text/javascript" src="{__LIBS__}layui/layui.js"></script>
    <script type="text/javascript" src="{__JS__}common.js?v=318"></script>
    <script src="{__JS__}gt.js"></script>
    <script>
        layui.use(['jquery', 'layer', 'form', 'admin', 'notice'], function () {
            var $ = layui.jquery;
            var layer = layui.layer;
            var form = layui.form;
            var admin = layui.admin;
            var notice = layui.notice;
            
            // 微信登录点击事件（若有对应按钮，这里保持原有逻辑，示例中暂隐藏该按钮，可根据需要恢复）
            $("#wechat_login").click(function(){
                notice.error({
                    title: '',
                    message: '暂不支持',
                    animateInside:true,
                    position:'topCenter',
                    transitionOut:'flipOutX',
                    transitionOutMobile: 'flipOutX',
                    displayMode:'2',
                    audio:'1'
                });
            });
            
            // 扫码登录点击事件
            $("#code").click(function(){
                admin.open({
                    type: 1,
                    area:['300px',''],
                    title:'扫码登录',
                    content: '<div class="form-group" style="text-align: center;"><div style="margin-top:1rem;margin-bottom:1rem;color:#666" id="login"><span id="loginmsg">请使用QQ手机版扫描二维码</span><span id="loginload" style="color: #790909;">.</span></div><div id="qrimg"></div><button type="button" id="mlogin" onclick="mloginurl()" class="layui-btn layui-btn-fluid layui-btn-normal">跳转QQ快捷登录</button></div>'
                });
            });
            
            // QQ登录点击事件
            $("#qq_login").click(function(){
                admin.btnLoading(' #loginBtn');
                admin.showLoading('#divLoading', 2, '.8');
                $.ajax({
                    type: "post",
                    url: "/api.php/Social/login",
                    data: {
                        "userType": "admin",
                    },
                    dataType: "json",
                    success: function(data) {
                        if (data.code == 0) {
                            notice.msg('正在为您跳转QQ登录页面...', {icon: 4, close: true, audio:'1'});
                            setTimeout(function (){
                                notice.destroy();
                                location.href=data.data.url;
                            },1000)
                        } else {
                            notice.error({
                                title: '',
                                message: data.msg,
                                animateInside:true,
                                position:'topCenter',
                                transitionOut:'flipOutX',
                                transitionOutMobile: 'flipOutX',
                                displayMode:'2',
                                audio:'1'
                            });
                        }
                        admin.removeLoading('#divLoading', true, true);
                        admin.btnLoading(' #loginBtn', false);
                    }, error: function () {
                        notice.error({
                            title: '',
                            message: '服务器错误，请稍后重试~',
                            animateInside:true,
                            position:'topCenter',
                            transitionOut:'flipOutX',
                            transitionOutMobile: 'flipOutX',
                            timeout:false,
                            displayMode:'2',
                            audio:'1'
                        });
                        admin.removeLoading('#divLoading', true, true);
                        admin.btnLoading(' #loginBtn', false);
                        return false;
                    }
                });
            });
            
            // 极验验证码初始化
            initGeetest4({
                captchaId: '647f5ed2ed8acb4be36784e01556bb71',
                product: 'bind',
            }, function (gt) {
                window.gt = gt
                gt
                    .appendTo("#captcha")
                    .onSuccess(function (e) {
                        var username = $("input[name='user']").val();
                        var password = $("input[name='pass']").val();
                        var result = gt.getValidate();
                        result.username = username;
                        result.password = password;
                        admin.btnLoading('#loginBtn');
                        admin.showLoading('#divLoading', 2, '.8');
                        $.ajax({
                            type: "post",
                            url: "/admin.php/Login/login.html",
                            data: result,
                            dataType: "json",
                            success: function(data) {
                                if (data.code == 0) {
                                    notice.success({
                                        title: '',
                                        message: data.msg,
                                        animateInside:true,
                                        position:'topCenter',
                                        transitionOut:'flipOutX',
                                        transitionOutMobile: 'flipOutX',
                                        displayMode:'2',
                                        audio:'1'
                                    });
                                    setTimeout(function (){
                                        location.href="/admin.php/Index/index.html";
                                    },2000)
                                } else {
                                    notice.error({
                                        title: '',
                                        message: data.msg,
                                        animateInside:true,
                                        position:'topCenter',
                                        transitionOut:'flipOutX',
                                        transitionOutMobile: 'flipOutX',
                                        displayMode:'2',
                                        audio:'1'
                                    });
                                }
                                admin.removeLoading('#divLoading', true, true);
                                admin.btnLoading('#loginBtn', false);
                            }, error: function () {
                                notice.error({
                                    title: '',
                                    message: '服务器错误，请稍后重试~',
                                    animateInside:true,
                                    position:'topCenter',
                                    transitionOut:'flipOutX',
                                    transitionOutMobile: 'flipOutX',
                                    timeout:false,
                                    displayMode:'2',
                                    audio:'1'
                                });
                                admin.removeLoading('#divLoading', true, true);
                                admin.btnLoading('#loginBtn', false);
                                return false;
                            }
                        });
                    });
            });

            // 登录按钮点击事件
            $('#loginBtn').click(function () {
                var user = $("input[name='user']").val();
                var pass = $("input[name='pass']").val();
                
                if(!user){
                    notice.warning({
                        title: '',
                        message: '请填写用户名！',
                        animateInside:true,
                        position:'topCenter',
                        transitionOut:'flipOutX',
                        transitionOutMobile: 'flipOutX',
                        displayMode:'2',
                        audio:'1'
                    });
                    return false;
                }
                
                if(!pass){
                    notice.warning({
                        title: '',
                        message: '请填写密码！',
                        animateInside:true,
                        position:'topCenter',
                        transitionOut:'flipOutX',
                        transitionOutMobile: 'flipOutX',
                        displayMode:'2',
                        audio:'1'
                    });
                    return false;
                }
                
                gt.showBox();
            });
        });
    </script>
</body>
</html>
