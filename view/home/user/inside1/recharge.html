<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线充值-{:conf('name')}</title>
    <script src="/template/CDN/js/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="{__LIBS__}layui/css/layui.css"/>
    <script src="{template}/inside1/css/3.4.16"></script>
    <script src="{template}/inside1/css/chart.umd.min.js"></script>
    <link href="{template}/inside1/css/font-awesome.min.css" rel="stylesheet">
    <link href="{template}/inside1/css/sweetalert2.min.css" rel="stylesheet">
    <script src="{template}/inside1/css/sweetalert2.all.min.js"></script>
    <script src="/template/CDN/js/clipboard.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#60a5fa',
                        success: '#10b981',
                        danger: '#ef4444',
                        warning: '#f59e0b',
                        glass: 'rgba(255, 255, 255, 0.85)',
                        glassBorder: 'rgba(255, 255, 255, 0.4)',
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <include file="/public/header">
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .glass-card {
                @apply bg-glass border border-glassBorder rounded-xl shadow-sm hover:shadow-md transition-all duration-300 backdrop-blur-sm;
            }
            .input-focus {
                @apply focus:border-primary focus:ring-2 focus:ring-primary/20 focus:outline-none transition-all;
            }
            .btn-primary {
                @apply bg-primary text-white font-medium py-3 px-6 rounded-lg shadow-md hover:bg-primary/90 hover:shadow-lg transform hover:-translate-y-0.5 transition-all duration-300;
            }
            .card-shadow {
                @apply shadow-sm hover:shadow-md transition-all duration-300;
            }
            .text-balance {
                text-wrap: balance;
            }
            /* 弹窗居中样式 */
            .swal2-center-modal {
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
            }
            .payment-method {
                @apply cursor-pointer p-3 transition-all duration-200 hover:border-primary/50 hover:bg-primary/5;
            }
            .payment-method.active {
                @apply border-primary bg-primary/10 ring-1 ring-primary/20;
            }
        }
        .max-w-7xl {
    max-width: 100rem;
}
    </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 font-inter text-gray-800">
    <main class="container mx-auto px-4 py-6 md:py-8 max-w-7xl">
          
        <!-- 顶部标题区域 -->
       
            <!-- 充值中心信息卡片 -->
            <div class="glass-card p-6 mb-6">
                <div class="flex items-center mb-4">
                    <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center mr-3">
                        <i class="fa fa-list-alt text-primary text-xl"></i>
                    </div>
                    <h2 class="text-lg font-bold text-gray-800">充值中心</h2>
                </div>
                
                <div class="space-y-3">
                    <p class="flex items-start">
                        <i class="fa fa-info-circle text-blue-500 mt-1 mr-2"></i>
                        <span>充值完成后需刷新网页以查看余额，通常秒到账。</span>
                    </p>
                    <p class="flex items-start">
                        <i class="fa fa-comments text-blue-500 mt-1 mr-2"></i>
                        <span>如充值遇到问题或有疑问联系：
                            <a href="#" class="text-blue-600 font-medium hover:underline" onclick="showContactModal()">联系我们</a>
                        </span>
                    </p>
                    <p class="flex items-start">
                        <i class="fa fa-shopping-cart text-blue-500 mt-1 mr-2"></i>
                        <span>充值完成后 
                            <a ew-href='/shop/index' class="text-blue-600 font-medium hover:underline">前往套餐中心购买套餐</a>
                        </span>
                    </p>
                </div>
                
                <div class="border-t border-gray-200/50 mt-4 pt-4 space-y-2">
                    <p class="flex items-center">
                        <i class="fa fa-money text-blue-500 mr-2"></i>
                        您当前余额：<span class="bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded-full text-sm font-medium">{$user.money} 元</span>
                    </p>
                    <p class="flex items-center">
                        <i class="fa fa-history text-blue-500 mr-2"></i>
                        您目前一共充值 <span class="bg-gray-100 text-gray-800 px-2 py-0.5 rounded-full text-sm font-medium">{$payc} 次</span>
                    </p>
                </div>
            </div>
            
            <!-- 支付宝充值表单 -->
            <div class="glass-card p-6 mb-6">
                <div class="flex items-center mb-4">
                    <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center mr-3">
                        <i class="fa fa-list-alt text-primary text-xl"></i>
                    </div>
                    <h2 class="text-lg font-bold text-gray-800">在线充值</h2>
                </div>
                
                <div class="flex flex-wrap gap-2 mb-4">
                    <a class="px-3 py-1 bg-primary text-white rounded-full text-sm" onclick="switchForm(1)">充值通道一</a>
                    <a class="px-3 py-1 bg-blue-100 text-blue-600 rounded-full text-sm" onclick="switchForm(2)">充值通道二</a>
                    <a ew-href='/user/card' class="px-3 py-1 bg-blue-100 text-blue-600 rounded-full text-sm hover:bg-blue-200 transition-colors">切换成-卡密充值</a>
                </div>
                
                <form id="rechargeForm" class="space-y-4">
                    <div>
                        <label for="money" class="block text-sm font-medium text-gray-700 mb-1.5">输入需充值金额</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fa fa-rmb text-gray-400"></i>
                            </div>
                            <input id="money" class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:border-blue-500 focus:ring-2 focus:ring-blue-200 focus:outline-none transition-all" type="number" required min="0.01" step="0.01" placeholder="请输入充值金额">
                        </div>
                    </div>
                    
                    <div class="flex justify-end">
                        <button type="button" class="bg-blue-500 hover:bg-blue-600 text-white font-medium py-2.5 px-6 rounded-lg shadow-sm transition-all duration-300 transform hover:-translate-y-0.5" onclick="go()">
                            <i class="fa fa-check mr-2"></i> 去充值
                        </button>
                    </div>
                </form>
                
                <form name="alipayment" id="alipayment" method="POST" class="space-y-6 hidden" onsubmit="return validateForm();" action="/pay/epayap">
                    <!-- 充值金额 -->
                    <div>
                        <label for="money2" class="block text-sm font-medium text-gray-700 mb-1.5">充值金额</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fa fa-rmb text-gray-400"></i>
                            </div>
                            <input id="money2" class="w-full pl-10 pr-4 py-3 border-2 border-primary focus:border-primary/70 rounded-lg input-focus" type="number" name="money" value="15" required autocomplete="off" min="0.01" step="0.01">
                        </div>
                        <p class="text-xs text-gray-500 mt-1">输入您要充值的金额,默认15元，可自行修改需要充值的金额</p>
                    </div>
                    
                    <!-- 支付方式 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-3">支付方式</label>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                            <label class="payment-method border rounded-lg" data-type="alipay">
                                <input type="radio" name="type" value="alipay" checked class="sr-only">
                                <div class="flex flex-col items-center">
                                    <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center mb-2">
                                     <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
    <!-- 背景圆 -->
    <circle cx="100" cy="100" r="90" fill="#00A0E9" />
    
    <!-- 钱包形状 -->
    <rect x="50" y="70" width="100" height="60" rx="10" fill="#FFFFFF" />
    <path d="M50,100 Q100,70 150,100" fill="none" stroke="#FFFFFF" stroke-width="5" />
    
    <!-- 货币符号 -->
    <text x="100" y="115" font-family="Arial, sans-serif" font-size="40" font-weight="bold" text-anchor="middle" fill="#00A0E9">¥</text>
</svg>
                                    </div>
                                    <span class="text-sm font-medium">支付宝</span>
                                </div>
                            </label>
                            
                            <label class="payment-method border rounded-lg" data-type="wxpay">
                                <input type="radio" name="type" value="wxpay" class="sr-only">
                                <div class="flex flex-col items-center">
                                    <div class="w-12 h-12 rounded-full bg-green-100 flex items-center justify-center mb-2">
                                        <i class="fa fa-weixin text-2xl text-green-500"></i>
                                    </div>
                                    <span class="text-sm font-medium">微信支付</span>
                                </div>
                            </label>
                            
                            <label class="payment-method border rounded-lg" data-type="qqpay">
                                <input type="radio" name="type" value="qqpay" class="sr-only">
                                <div class="flex flex-col items-center">
                                    <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center mb-2">
                                        <i class="fa fa-qq text-2xl text-blue-500"></i>
                                    </div>
                                    <span class="text-sm font-medium">QQ钱包</span>
                                </div>
                            </label>
                            
                            <label class="payment-method border rounded-lg" data-type="bank">
                                <input type="radio" name="type" value="bank" class="sr-only">
                                <div class="flex flex-col items-center">
                                    <div class="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center mb-2">
                                        <i class="fa fa-credit-card text-2xl text-red-500"></i>
                                    </div>
                                    <span class="text-sm font-medium">云闪付</span>
                                </div>
                            </label>
                        </div>
                    </div>
                    
                    <!-- 立即充值按钮 -->
                    <div>
                        <button class="btn-primary w-full flex items-center justify-center">
                            <i class="fa fa-check mr-2"></i> 立 即 充 值
                        </button>
                    </div>
                </form>
            </div>
            
            <!-- 充值记录 -->
            <div class="glass-card p-6">
                <div class="flex items-center mb-4">
                    <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center mr-3">
                        <i class="fa fa-history text-blue-600"></i>
                    </div>
                    <h2 class="text-lg font-bold text-gray-800">充值记录</h2>
                </div>
                
                <div class="overflow-x-auto">
                    <table id="SK_Table" lay-filter="SK_Table"></table>
                </div>
            </div>
        </div>
        
        <!-- 模态框 -->
        <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden" id="readytopay">
            <div class="bg-white rounded-lg max-w-md w-full p-6 transform transition-all shadow-xl">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-gray-800">正在连接支付网关</h3>
                    <button class="text-gray-400 hover:text-gray-600 transition-colors" id="close">
                        <i class="fa fa-times"></i>
                    </button>
                </div>
                <p class="text-gray-600" id="title">感谢您对我们的支持，请耐心等待</p>
            </div>
        </div>
        
        <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden" id="result">
            <div class="bg-white rounded-lg max-w-md w-full p-6 transform transition-all shadow-xl">
                <p class="text-gray-800 font-medium mb-4" id="msg"></p>
                <div class="flex justify-end">
                    <button class="bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded transition-colors" id="result_ok">知道了</button>
                </div>
            </div>
        </div>
    </main>

    <script src="{template}/inside1/css/3.4.16"></script>
    <script type="text/javascript" src="/Assets/libs/layui/layui.js"></script>
    <script type="text/javascript" src="/Assets/js/common.js?v=318"></script>
    <script>
        // 显示通知弹窗（确保居中）
        function showNotification(message, type = 'success') {
            // 移除之前可能存在的弹窗
            const existingSwal = document.querySelector('.swal2-container');
            if (existingSwal) {
                existingSwal.remove();
            }
            
            Swal.fire({
                position: 'center',
                icon: type,
                title: message,
                showConfirmButton: false,
                timer: 1500,
                customClass: {
                    container: 'swal2-center-modal',
                    popup: 'bg-white rounded-xl shadow-lg border-none mx-4 max-w-xs w-full'
                },
                width: '90%',
                maxWidth: '300px'
            });
        }

        // 切换表单显示函数
        function switchForm(channel) {
            const form1 = document.getElementById('rechargeForm');
            const form2 = document.getElementById('alipayment');
            const tabs = document.querySelectorAll('.flex.flex-wrap.gap-2.mb-4 a');
            
            if (channel === 1) {
                form1.classList.remove('hidden');
                form2.classList.add('hidden');
                tabs[0].className = 'px-3 py-1 bg-primary text-white rounded-full text-sm';
                tabs[1].className = 'px-3 py-1 bg-blue-100 text-blue-600 rounded-full text-sm';
            } else if (channel === 2) {
                form1.classList.add('hidden');
                form2.classList.remove('hidden');
                tabs[0].className = 'px-3 py-1 bg-blue-100 text-blue-600 rounded-full text-sm';
                tabs[1].className = 'px-3 py-1 bg-primary text-white rounded-full text-sm';
            }
        }

        // 模态框控制
        function showModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            // 添加淡入动画
            setTimeout(() => {
                modal.querySelector('div').classList.add('opacity-100', 'translate-y-0');
                modal.querySelector('div').classList.remove('opacity-0', '-translate-y-4');
            }, 10);
        }
        
        function hideModal(modalId) {
            const modal = document.getElementById(modalId);
            const content = modal.querySelector('div');
            // 添加淡出动画
            content.classList.add('opacity-0', '-translate-y-4');
            content.classList.remove('opacity-100', 'translate-y-0');
            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }, 300);
        }
        
        // 联系我们模态框
        function showContactModal() {
            Swal.fire({
                title: '联系我们',
                html: `
                    <div class="text-left">
                        <p class="mb-2">如果您在充值过程中遇到任何问题，请通过以下方式联系我们：</p>
                        <p class="mb-2 flex items-center"><i class="fa fa-envelope-o mr-2 text-primary"></i> QQ：{:conf('kefuqq')}</p>
                        <p class="mb-2 flex items-center"><i class="fa fa-phone mr-2 text-primary"></i> QQ群：{:conf('qqgroupurl')}</p>
                        <p class="flex items-center"><i class="fa fa-comments-o mr-2 text-primary"></i> 在线客服：工作日 9:00-18:00</p>
                    </div>
                `,
                confirmButtonText: '关闭',
                confirmButtonColor: '#3b82f6',
                customClass: {
                    container: 'swal2-center-modal'
                }
            });
        }

        // 充值提交
        function go() {
            const money = document.getElementById('money').value;
            if (!money || isNaN(money) || parseFloat(money) <= 0) {
                showNotification('请输入有效的充值金额', 'error');
                return;
            }
            
            showModal('readytopay');
            $.ajax({
                type: 'POST',
                url: '/user/pay',
                data: {money: money},
                dataType: "json",
                success: function(res){
                    if(res.code === 0){
                        document.getElementById('msg').textContent = "处理成功,跳转中...";
                        setTimeout(() => {
                            window.location.href = '/user/san?id='+res.data.id;
                        }, 1000);
                    } else {
                        hideModal('readytopay');
                        showModal('result');
                        document.getElementById('msg').textContent = res.msg;   
                    }
                },
                error: function(){
                    hideModal('readytopay');
                    showModal('result');
                    document.getElementById('msg').textContent = "请求出错，请稍后重试";
                }
            });
        }

        // 支付方式选择交互
        document.addEventListener('DOMContentLoaded', function() {
            const paymentMethods = document.querySelectorAll('.payment-method');
            
            paymentMethods.forEach(method => {
                method.addEventListener('click', function() {
                    // 移除所有选中状态
                    paymentMethods.forEach(m => m.classList.remove('active'));
                    // 添加当前选中状态
                    this.classList.add('active');
                    // 选中对应的radio按钮
                    const radio = this.querySelector('input[type="radio"]');
                    if (radio) radio.checked = true;
                });
            });
            
            // 初始化选中状态
            const defaultMethod = document.querySelector('input[name="type"]:checked').closest('.payment-method');
            if (defaultMethod) defaultMethod.classList.add('active');

            // 模态框关闭按钮事件
            document.getElementById('close').addEventListener('click', () => {
                hideModal('readytopay');
            });
            
            document.getElementById('result_ok').addEventListener('click', () => {
                hideModal('result');
            });
        });
        
        // 表单验证
        function validateForm() {
            const moneyInput = document.querySelector('input[name="money"]');
            const money = parseFloat(moneyInput.value);
            const paymentType = document.querySelector('input[name="type"]:checked').value;
            
            // 验证金额为数字且大于0
            if (isNaN(money) || money <= 0) {
                showNotification('请输入有效的充值金额，金额必须大于0', 'error');
                return false;
            }
            
            // 显示确认弹窗，并动态显示支付方式
            Swal.fire({
                title: '确认充值',
                html: '确认要给UID <strong>{$user.uid}</strong> 充值 <strong>' + money.toFixed(2) + '</strong> 元吗？<br>' +
                  '支付方式：<strong>' + 
                  (paymentType === 'wxpay' ? '微信支付' : 
                   paymentType === 'alipay' ? '支付宝' : 
                   paymentType === 'qqpay' ? 'QQ钱包' : 
                   paymentType === 'bank' ? '云闪付' : '未知支付方式') + '</strong>',
                showCancelButton: true,
                confirmButtonText: '确认',
                cancelButtonText: '取消',
                confirmButtonColor: '#3b82f6',
                cancelButtonColor: '#6b7280',
                customClass: {
                    container: 'swal2-center-modal'
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    // 显示正在处理的弹窗
                    const loading = Swal.fire({
                        title: '正在处理',
                        html: '请稍候，正在连接支付网关...',
                        allowOutsideClick: false,
                        showConfirmButton: false,
                        didOpen: () => {
                            Swal.showLoading();
                        },
                        customClass: {
                            container: 'swal2-center-modal'
                        }
                    });
                    
                    // 提交表单
                    setTimeout(() => {
                        document.forms["alipayment"].submit();
                    }, 500);
                }
            });
            return false; // 防止表单立即提交
        }

        // 初始化表格
        layui.use(['form', 'table', 'layer'], function(){
            const form = layui.form;
            const layer = layui.layer;
            const $ = layui.jquery;
            const table = layui.table;
            
            // 兑换卡密
            form.on('submit(cardForm)', function(data){
                layer.load(1);
                $.ajax({
                    type: 'POST',
                    url: '/user/redeem_card',
                    data: data.field,
                    dataType: "json",
                    success: function(res){
                        layer.closeAll('loading');
                        showNotification(res.msg, res.code === 0 ? 'success' : 'error');
                    },
                    error: function(){
                        layer.closeAll('loading');
                        showNotification('操作失败，请稍后再试', 'error');
                    }
                });
                return false;
            });
            
            // 渲染表格
            const insTb = table.render({
                elem: '#SK_Table',
                url: '{:url("/ajax/cardlist")}',
                method: 'post',
                page: true,
                skin: 'line',
                size: 'lg',
                cellMinWidth: 100,
                request: {
                    pageName: 'current_page',
                    limitName: 'limit'
                },
                parseData: function(res){
                    return {
                        "code": res.code,
                        "msg": res.msg,
                        "count": res.data.data.total,
                        "data": res.data.data.data
                    };
                },
                cols: [[
                    {field: 'order_id', title: '订单号', minWidth: 280},
                    {field: 'money', title: '充值金额', minWidth: 160},
                    {field: 'time', title: '充值时间', minWidth: 160},
                    {field: 'fs', title: '支付方式', minWidth: 160}
                ]]
            });
        });
    </script>
</body>
</html>
