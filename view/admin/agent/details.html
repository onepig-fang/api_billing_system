<include file="/public/header">
    <!-- 正文开始 -->
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body">
     <form id="Sk_EditForm" lay-filter="Sk_EditForm" class="layui-form ">
        <input name="id" value="{:isset($user.id) ? $user.id : ''}" type="hidden"/>
   
       
            <div class="layui-form-item">
                <label class="layui-form-label layui-form-required">账号:</label>
                <div class="layui-input-block">
                    <input type="text" name="username" value="{:isset($user.username) ? $user.username : ''}" placeholder="请输入账号" class="layui-input"
                           lay-verType="tips" lay-verify="required"/>
                </div>
            </div>
  <div class="layui-form-item">
                <label class="layui-form-label layui-form-required">密码:</label>
                <div class="layui-input-block">
                    <input type="text" name="password"  placeholder="请输入密码" class="layui-input"
                         />
                </div>
            </div>
              <div class="layui-form-item">
                <label class="layui-form-label layui-form-required">标识:</label>
                <div class="layui-input-block">
                    <input type="text" name="name"  placeholder="请输入标识"  value="{:isset($user.name) ? $user.name : ''}" class="layui-input"
                           lay-verType="tips" lay-verify="required"/>
                </div>
            </div>
         
            <empty name='$user'>
        <else/>
           <div class="layui-form-item">
                <label class="layui-form-label layui-form-required">身份:</label>
                <div class="layui-input-block">
                         <select class="form-control" name="auth">
                                    <option value="代理" <if isset($user.auth) && $user.auth=='代理'>selected</if>>代理</option>
                                     <option value="超级管理员" <if isset($user.auth) && $user.auth=='超级管理员'>selected</if>>超级管理员</option>
                                     </select>
                </div>
            </div>
              <div class="layui-form-item">
                <label class="layui-form-label layui-form-required">解析:</label>
                <div class="layui-input-block">
                         <select class="form-control" name="json">
                                    <option value="1" <if isset($user.json) && $user.json==1>selected</if>>开启</option>    
                                     <option value="0" <if isset($user.json) && $user.json==0>selected</if>>关闭</option> 
                                     </select>
                </div>
            </div>
             <div class="layui-form-item">
                <label class="layui-form-label layui-form-required">套餐:</label>
                <div class="layui-input-block">
                         <select class="form-control" name="shop">
                                    <option value="1" <if isset($user.shop) && $user.shop==1>selected</if>>开启</option>    
                                     <option value="0" <if isset($user.shop) && $user.shop==0>selected</if>>关闭</option> 
                                     </select>
                </div>
            </div>
             <div class="layui-form-item">
                <label class="layui-form-label layui-form-required">支付:</label>
                <div class="layui-input-block">
                         <select class="form-control" name="pay">
                                    <option value="1" <if isset($user.pay) && $user.pay==1>selected</if>>开启</option>    
                                     <option value="0" <if isset($user.pay) && $user.pay==0>selected</if>>关闭</option> 
                                     </select>
                </div>
            </div>
               <div class="layui-form-item">
                <label class="layui-form-label layui-form-required">状态:</label>
                <div class="layui-input-block">
                         <select class="form-control" name="ban">
                                    <option value="1" <if isset($user.ban) && $user.ban==1>selected</if>>开启</option>    
                                     <option value="0" <if isset($user.ban) && $user.ban==0>selected</if>>关闭</option> 
                                     </select>
                </div>
            </div>
            </empty>
        

     
       
       <hr style="width:0px"><hr>
                    <div class="layui-form-item">
                        <div class="layui-btn-container">
                            <button type="button" class="layui-btn" id="noticeBtn" lay-filter="submitBtn" lay-submit>&emsp;提交&emsp;</button>
                  
                        </div>
                    </div>
    </form>
    </div>
    </div>
    </div>
    <include file="/public/footer">
        <script>
    layui.use([ 'admin', 'form', 'jquery', 'notice'], function () {
        var form = layui.form;
        var $ = layui.jquery;
        var notice = layui.notice;

        var admin = layui.admin;
        form.on('submit(submitBtn)', function (data) {
            if (data.field.name == "") {
                notice.msg('请输入名称！', {icon: 3, audio:'1'});
                return false;
            }
    
            notice.msg('正在执行中..', {icon: 4, close: true});
            $.ajax({
                type: "POST",
                url: "{:url('/agent/edit')}",
                data: data.field,
                dataType: "json",
                success: function(data) {
                    notice.destroy();
                    if (data.code == 0) {
                        notice.msg(data.msg, {icon: 1, audio:'1'});
                             var index = parent.layer.getFrameIndex(window.name);
                  setTimeout(function () {
                parent.layer.close(index);
                           parent.location.reload();
                  },500);
                    } else {
                        notice.msg(data.msg, {icon: 2, audio:'1'});
                    }
                }
            });
            return false;
        });

    });
</script>
