    <script>
        // 联系管理员功能
        function contactAdmin() {
            Swal.fire({
                title: '联系管理员',
                html: `
                    <div class="text-left">
                        <p class="mb-2">如果您需要添加采集套餐，请通过以下方式联系管理员：</p>
                        <p class="mb-2 flex items-center"><i class="fa fa-envelope-o mr-2 text-primary"></i> QQ：{:conf('kefuqq')}</p>
                        <p class="flex items-center"><i class="fa fa-phone mr-2 text-primary"></i> 群号：{:conf('qqgroupurl')}</p>
                    </div>
                `,
                confirmButtonText: '关闭',
                confirmButtonColor: '#3b82f6'
            });
        }
        
        // 显示套餐选择选项
        function showPackageOptions(packageId, packageName, priceMonth, priceQuarter, priceHalfYear, priceYear, durationMonth, durationQuarter, durationHalfYear, durationYear) {
            // 获取当前余额
            const currentBalance = parseFloat("{$user.money}");
            
            // 弹出套餐选择弹窗
            Swal.fire({
                title: `选择购买采集接口 <br>当前套餐：${packageName}`,
                html: `
                    <style>
                        .package-options {
                            display: grid;
                            grid-template-columns: 1fr;
                            gap: 10px;
                            padding: 10px;
                        }
                        @media (min-width: 640px) {
                            .package-options {
                                grid-template-columns: repeat(2, 1fr);
                            }
                        }
                        .package-option {
                            padding: 15px;
                            border: 1px solid #ddd;
                            border-radius: 8px;
                            cursor: pointer;
                            transition: transform 0.3s ease, background-color 0.3s, border-color 0.3s;
                            display: flex;
                            flex-direction: column;
                            justify-content: center;
                        }
                        .package-option:hover {
                            transform: scale(1.02);
                            background-color: #f0f8ff;
                            border-color: #007bff;
                        }
                        .package-option.selected {
                            background-color: #e6f4ff;
                            border-color: #007bff;
                        }
                        .package-option h4 {
                            margin: 0;
                            font-size: 16px;
                            font-weight: 600;
                            color: #333;
                        }
                        .package-option p {
                            margin: 5px 0 0 0;
                            font-size: 14px;
                            color: #666;
                        }
                    </style>
                    <div class="package-options">
                        <div class="package-option" data-package-type="month" data-package-price="${priceMonth}">
                            <h4>一个月采集套餐</h4>
                            <p>价格：${priceMonth} 元 / ${durationMonth} 天</p>
                        </div>
                        <div class="package-option" data-package-type="quarter" data-package-price="${priceQuarter}">
                            <h4>一季度采集套餐</h4>
                            <p>价格：${priceQuarter} 元 / ${durationQuarter} 天</p>
                        </div>
                        <div class="package-option" data-package-type="half_year" data-package-price="${priceHalfYear}">
                            <h4>半年采集套餐</h4>
                            <p>价格：${priceHalfYear} 元 / ${durationHalfYear} 天</p>
                        </div>
                        <div class="package-option" data-package-type="year" data-package-price="${priceYear}">
                            <h4>一年采集套餐</h4>
                            <p>价格：${priceYear} 元 / ${durationYear} 天</p>
                        </div>
                    </div>
                `,
                showConfirmButton: false,
                showCancelButton: true,
                cancelButtonText: '关闭',
                cancelButtonColor: '#d33',
                width: '90%',
                maxWidth: '600px',
                padding: '20px',
            });
            
            // 监听套餐选择按钮点击事件
            document.querySelectorAll('.package-option').forEach(function(option) {
                option.addEventListener('click', function() {
                    // 移除所有选项的选中样式
                    document.querySelectorAll('.package-option').forEach(function(opt) {
                        opt.classList.remove('selected');
                    });
                    
                    // 为当前选中的选项添加选中样式
                    this.classList.add('selected');
                    
                    const packageType = this.getAttribute('data-package-type');
                    const packagePrice = parseFloat(this.getAttribute('data-package-price'));
                    
                    // 根据 packageType 生成套餐名称
                    let packageTypeName;
                    switch (packageType) {
                        case 'month':
                            packageTypeName = '一个月采集套餐';
                            break;
                        case 'quarter':
                            packageTypeName = '一季度采集套餐';
                            break;
                        case 'half_year':
                            packageTypeName = '半年采集套餐';
                            break;
                        case 'year':
                            packageTypeName = '一年采集套餐';
                            break;
                        default:
                            packageTypeName = '未知采集套餐';
                    }
                    
                    // 检查余额是否充足
                    if (currentBalance < packagePrice) {
                        Swal.fire({
                            title: `当前余额不足剩 <span style="color: red;">${currentBalance}</span> 元`,
                            html: `
                                <p>无法购买套餐：<strong>${packageName}</br> ${packageTypeName}</strong>价格为：<strong>${packagePrice} 元</strong>。</p>
                                <p>请先充值后再购买。</p>
                            `,
                            icon: 'error',
                            showCancelButton: true,
                            confirmButtonText: '在线充值',
                            cancelButtonText: '卡密充值',
                            confirmButtonColor: '#3b82f6',
                            cancelButtonColor: '#6b7280'
                        }).then((result) => {
                            if (result.isConfirmed) {
                                // 如果用户点击“在线充值”，跳转到在线充值页面
                                window.location.href = "/user/recharge";
                            } else if (result.dismiss === Swal.DismissReason.cancel) {
                                // 如果用户点击“卡密充值”，跳转到卡密充值页面
                                window.location.href = "/user/card/";
                            }
                        });
                    } else {
                        Swal.fire({
                            title: '确认购买吗？',
                            html: `
                                您将购买套餐：<strong>${packageName}</br> ${packageTypeName}</strong>价格为：<span class="text-primary font-bold">${packagePrice} 元</span>。
                            `,
                            icon: 'warning',
                            showCancelButton: true,
                            confirmButtonText: '确认购买',
                            cancelButtonText: '取消',
                            confirmButtonColor: '#3b82f6',
                            cancelButtonColor: '#6b7280'
                        }).then((result) => {
                            if (result.isConfirmed) {
                                // 如果用户确认购买，则跳转到购买页面
                              //  window.location.href = `/user/shop/purChase?id=${packageId}&type=${packageType}`;
                                   $.ajax({
                    type: 'POST',
                    url: '/shop/buy',
                    data: {id:packageId,type:packageType},
                      dataType: "json",
                    success: function(res){
                        if(res.code ===0){
                                   // 显示成功信息
        Swal.fire({
                                        icon: 'success',
                                        title: '成功',
                                        text: res.msg,
                                        confirmButtonColor: '#3b82f6'
                                    }).then(() => {
                                        // 刷新页面以更新余额
                                        location.reload();
                                    });
                        } else {
                            Swal.fire({
                                        icon: 'error',
                                        title: '失败',
                                        text: res.msg,
                                        confirmButtonColor: '#3b82f6'
                                    });
                        }
                    },
                    error: function(){
            ;
                     
                                    Swal.fire({
                                        icon: 'error',
                                        title: '请求失败，请检查网络后重试',
                                        text: '请求失败，请检查网络后重试',
                                        confirmButtonColor: '#3b82f6'
                                    });;
                    }
                });
                            }
                        });
                    }
                });
            });
        }
    </script>
