<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{:conf('name')}-找回密码</title>
    <!-- Tailwind CSS v3 -->
  <script src="{template}/inside1/css/3.4.16"></script>
    <link href="{template}/inside1/css/font-awesome.min.css" rel="stylesheet">
    <script src="{template}/inside1/css/sweetalert2.all.min.js"></script>
    <link href="{template}/inside1/css/sweetalert2.min.css" rel="stylesheet">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    
    <!-- 配置Tailwind自定义主题 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        secondary: '#36CFC9',
                        neutral: {
                            100: '#F2F3F5',
                            200: '#E5E6EB',
                            300: '#C9CDD4',
                            400: '#86909C',
                            500: '#4E5969',
                            600: '#272E3B',
                            700: '#1D2129',
                        }
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    boxShadow: {
                        'glass': '0 8px 32px rgba(0, 0, 0, 0.1)',
                        'glass-hover': '0 12px 48px rgba(0, 0, 0, 0.15)',
                    }
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .backdrop-blur-md {
                backdrop-filter: blur(12px);
            }
            .glass-effect {
                background: rgba(255, 255, 255, 0.15);
                backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
            .glass-card {
                background: rgba(255, 255, 255, 0.25);
                backdrop-filter: blur(16px);
                border: 1px solid rgba(255, 255, 255, 0.18);
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
                transition: all 0.3s ease;
            }
            .glass-card:hover {
                box-shadow: 0 12px 48px rgba(0, 0, 0, 0.15);
                transform: translateY(-2px);
            }
            .floating-label {
                position: absolute;
                pointer-events: none;
                left: 1rem;
                top: 0.75rem;
                transition: 0.2s ease all;
                color: #86909C;
            }
            .form-input:focus ~ .floating-label,
            .form-input:not(:placeholder-shown) ~ .floating-label {
                top: -0.5rem;
                left: 0.75rem;
                font-size: 0.75rem;
                color: #165DFF;
                background-color: white;
                padding: 0 0.25rem;
            }
            .btn-primary {
                @apply bg-primary hover:bg-primary/90 text-white font-medium py-2.5 px-4 rounded-lg transition-all duration-300 transform hover:scale-[1.02] focus:outline-none focus:ring-2 focus:ring-primary/50;
            }
            .btn-secondary {
                @apply bg-white/20 hover:bg-white/30 text-white font-medium py-2.5 px-4 rounded-lg transition-all duration-300 transform hover:scale-[1.02] focus:outline-none focus:ring-2 focus:ring-white/30;
            }
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-primary/90 to-secondary/90 font-inter text-neutral-700 overflow-x-hidden">
    <!-- 背景装饰元素 -->
    <div class="fixed inset-0 overflow-hidden -z-10">
        <div class="absolute -top-40 -right-40 w-96 h-96 bg-primary/30 rounded-full blur-3xl"></div>
        <div class="absolute top-1/3 -left-20 w-80 h-80 bg-secondary/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 right-1/4 w-96 h-96 bg-primary/20 rounded-full blur-3xl"></div>
    </div>
    
    <div class="min-h-screen flex flex-col items-center justify-center p-4 md:p-8">
        <!-- 导航栏 -->
        <div class="w-full max-w-7xl flex justify-between items-center mb-8">
            <a href="/index/login" class="glass-effect rounded-lg px-4 py-2 flex items-center gap-2 text-white hover:bg-white/20 transition-all">
                <i class="fa fa-arrow-left"></i>
                <span>登录</span>
            </a>
            <a href="/" class="glass-effect rounded-lg px-4 py-2 flex items-center gap-2 text-white hover:bg-white/20 transition-all">
                <i class="fa fa-home"></i>
                <span>首页</span>
            </a>
        </div>
        
        <!-- 主内容区 -->
        <div class="w-full max-w-md">
            <!-- 玻璃态卡片 -->
            <div class="glass-card rounded-2xl p-6 md:p-8">
                <!-- Logo区域 -->
                <div class="flex justify-center mb-8">
                    <div class="bg-white/20 rounded-full p-4 backdrop-blur-md">
                        <img src="{:conf('logo')}" alt="Logo" class="h-16 md:h-20 object-contain">
                    </div>
                </div>
                
                <h2 class="text-[clamp(1.5rem,3vw,2rem)] font-bold text-center mb-8 text-white">找回密码</h2>
                
                <!-- 表单 -->
                <form id="recoveryForm" action="javascript:void(0);" method="POST" class="layui-form space-y-6">
                    <!-- 用户名输入框 -->
                    <div class="relative">
                        <input type="text" id="user" name="user" inputmode="user" autocomplete="username" 
                            class="form-input w-full bg-white/20 border border-white/30 rounded-lg py-3 px-4 text-white placeholder-transparent focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary/50 transition-all"
                            required placeholder=" ">
                        <label for="user" class="floating-label">用户名</label>
                    </div>
                    
                    <!-- 验证码输入框 -->
                    <div class="relative flex gap-3">
                        <div class="flex-1 relative">
                            <input type="text" id="code" name="code" inputmode="code" autocomplete="off" 
                                class="form-input w-full bg-white/20 border border-white/30 rounded-lg py-3 px-4 text-white placeholder-transparent focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary/50 transition-all"
                                required placeholder=" ">
                            <label for="code" class="floating-label">验证码</label>
                        </div>
                        <button type="button" id="countdown-btn" 
                            class="btn-secondary whitespace-nowrap min-w-[120px]">
                            获取验证码
                        </button>
                    </div>
                    
                    <!-- 新密码输入框 -->
                    <div class="relative">
                        <input type="password" id="pass" name="pass" inputmode="pass" autocomplete="new-password" 
                            class="form-input w-full bg-white/20 border border-white/30 rounded-lg py-3 px-4 text-white placeholder-transparent focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary/50 transition-all"
                            required placeholder=" ">
                        <label for="pass" class="floating-label">新密码</label>
                    </div>
                    
                    <!-- 确认新密码输入框 -->
                    <div class="relative">
                        <input type="password" id="newpass" name="newpass" inputmode="pass" autocomplete="new-password" 
                            class="form-input w-full bg-white/20 border border-white/30 rounded-lg py-3 px-4 text-white placeholder-transparent focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary/50 transition-all"
                            required placeholder=" ">
                        <label for="newpass" class="floating-label">确认新密码</label>
                    </div>
                    
                    <!-- 提交按钮 -->
                    <button type="submit" id="querySubmit" 
                        class="btn-primary w-full flex justify-center items-center gap-2">
                        <span>找回密码</span>
                        <i class="fa fa-arrow-right"></i>
                    </button>
                    
                    <!-- 注册链接 -->
                    <div class="text-center text-white/80 text-sm">
                        还没有账号？ <a href="/index/register" class="text-white font-medium hover:underline">立即注册</a>
                    </div>
                </form>
                
                <!-- 服务条款 -->
                <div class="mt-8 text-center text-white/60 text-xs">
                    <p>登录即代表同意<a href='/service.html' target="_blank" class="hover:underline">服务条款</a>，以及保证所录入信息的真实性，如有不实信息会导致账号被删除。</p>
                </div>
            </div>
        </div>
        
        <!-- 页脚 -->
        <footer class="mt-12 text-center text-white/60 text-xs">
            <p>&copy;2025 {:conf('name')}</p>
        </footer>
    </div>
    <script type="text/javascript" src="{__LIBS__}layui/layui.js"></script>
<script type="text/javascript" src="{__JS__}common.js?v=318"></script>
     <script>
      layui.use([ 'layer', 'form'], function () {
        var $ = layui.jquery;
  
        var layer = layui.layer;
        var form = layui.form;
        //发送验证码
      // form.on('submit(mailboxSubmit)', function(obj) {
        $('#countdown-btn').on('click', function(){
               var name = $("#user").val();//联系QQ
              
               if(name==''){
                  // console.log('请输入QQ');
               layer.msg('请输入登录用户名', {icon: 2, anim: 6});     
               
            return false;
               }
            //  const loadIndex = layer.msg('请求中...', {icon: 16, shade: 0.01, time: false});
           


                $.ajax({
                type: "POST",
                url: '/ajax/codes.html',
                data: {'user':name},
                dataType: "json",
                success: function(res) {
        
                        if (res.code == 1) {
                             layer.msg(res.msg, {icon: 1, anim: 6});
                              let count=60; // 设置倒计时时间
          let countdown=setInterval(function(){
              $("#countdown-btn").prop("disabled", true); // 禁用按钮
              $("#countdown-btn").text("重新发送("+ count +"s)"); // 更新按钮文本
              count--; // 计数器减1
              if (count === 0) { // 倒计时结束
                  clearInterval(countdown); // 清除计时器
                  $("#countdown-btn").prop("disabled", false); // 启用按钮
                  $("#countdown-btn").text("获取验证码"); // 还原按钮文本
              }
          }, 1000); // 每秒更新一次

                        } else {
                            layer.msg(res.msg, {icon: 2, anim: 6});
                        }
                   
                    }
                });
                
                 });

          //修改密码    
       //   form.on('submit(querySubmit)', function(obj) {
        $('#querySubmit').on('click', function(){
               var name = $("#user").val();//用户名
               var pass = $("#pass").val();//新密码
               var newpass = $("#newpass").val();//二次新密码
               var code = $("#code").val();//验证码
           if(code==''){
               layer.msg('请输入验证码', {icon: 2, anim: 6});    
               
            return false;
               }
               if(pass==''){
               layer.msg('请输入新密码', {icon: 2, anim: 6});   
               
            return false;
               }
               if(pass!=newpass){
                layer.msg('两次输入的密码不同', {icon: 2, anim: 6});  
                
            return false;
               }
              // const loadIndex = layer.msg('请求中...', {icon: 16, shade: 0.01, time: false});
                $.ajax({
                type: "POST",
                url: '/ajax/authset.html',
                data: {'user':name,'pass':pass,'code':code},
                dataType: "json",
                success: function(res) {
        
                        if (res.code == 1) {
                               layer.msg(res.msg, {icon: 1, anim: 6});

                        } else {
                            layer.msg(res.msg, {icon: 2, anim: 6});
                        }
                   
                    }
                });
                
                 });
                
      });
      
        </script> 
</body>
</html>
