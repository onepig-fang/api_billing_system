    <script type="text/javascript" src="/Assets/libs/layui/layui.js"></script>

    <script>
        layui.use(['form', 'layer'], function(){
            var form = layui.form;
            var layer = layui.layer;
            var $ = layui.jquery;
            
            // 修改密码
            form.on('submit(passwordForm)', function(data){
                layer.load(1, {
                    shade: [0.3, '#fff'],
                    content: '正在更新密码...',
                    success: function(layero) {
                        layero.find('.layui-layer-content').css({
                            'padding-top': '30px',
                            'textAlign': 'center'
                        });
                    }
                });
                
                $.ajax({
                    type: 'POST',
                    url: '/user/edit',
                    data: data.field,
                    dataType: "json",
                    success: function(res){
                        layer.closeAll('loading');
                        if(res.code === 0){
                            layer.msg(res.msg, {
                                icon: 1,
                                time: 1500,
                                shade: 0.3
                            });
                        } else {
                            layer.msg(res.msg, {icon: 2, shade: 0.3});
                        }
                    },
                    error: function(){
                        layer.closeAll('loading');
                        layer.msg('操作失败，请稍后再试', {icon: 2, shade: 0.3});
                    }
                });
                return false;
            });
            
            // 解绑QQ（修复部分）
            form.on('submit(jcqq)', function(data){
                // 1. 增加参数验证
                if(!data.field.user_id || !data.field.method){
                    layer.msg('参数错误，请刷新页面重试', {icon: 2, shade: 0.3});
                    return false;
                }
                
                layer.confirm('确定要解除QQ绑定吗？解绑后将无法使用QQ快捷登录。', {
                    title: '确认解绑',
                    icon: 3,
                    shade: 0.3
                }, function(index){
                    layer.close(index);
                    
                    layer.load(1, {
                        shade: [0.3, '#fff'],
                        content: '正在解除绑定...',
                        success: function(layero) {
                            layero.find('.layui-layer-content').css({
                                'padding-top': '30px',
                                'textAlign': 'center'
                            });
                        }
                    });
                    
                    // 2. 修正请求URL和数据传递
                    $.ajax({
                        type: 'POST',
                        url: '/user/jcqq',  // 确保此URL正确处理QQ解绑
                        data: {
                            method: data.field.method,
                            user_id: data.field.user_id,
                            action: 'unbind'  // 增加明确的操作类型
                        },
                        dataType: "json",
                        // 3. 增加请求超时处理
                        timeout: 10000,
                        success: function(res){
                            layer.closeAll('loading');
                            if(res.code === 0){
                                layer.msg(res.msg, {
                                    icon: 1,
                                    time: 1500,
                                    shade: 0.3
                                }, function(){
                                    location.reload();
                                });
                            } else {
                                layer.msg(res.msg || '解绑失败', {icon: 2, shade: 0.3});
                            }
                        },
                        error: function(xhr, status, error){
                            layer.closeAll('loading');
                            // 4. 更详细的错误提示
                            if(status === 'timeout'){
                                layer.msg('请求超时，请稍后再试', {icon: 2, shade: 0.3});
                            } else {
                                layer.msg('网络错误或服务器异常', {icon: 2, shade: 0.3});
                            }
                        }
                    });
                });
                
                return false;
            });
            
            // 解绑微信
            form.on('submit(jcwx)', function(data){
                layer.confirm('确定要解除微信绑定吗？解绑后将无法使用微信快捷登录。', {
                    title: '确认解绑',
                    icon: 3,
                    shade: 0.3
                }, function(index){
                    layer.close(index);
                    
                    layer.load(1, {
                        shade: [0.3, '#fff'],
                        content: '正在解除绑定...',
                        success: function(layero) {
                            layero.find('.layui-layer-content').css({
                                'padding-top': '30px',
                                'textAlign': 'center'
                            });
                        }
                    });
                    
                    $.ajax({
                        type: 'POST',
                        url: '/user/jcwx',
                        data: data.field,
                        dataType: "json",
                        success: function(res){
                            layer.closeAll('loading');
                            if(res.code === 0){
                                layer.msg(res.msg, {
                                    icon: 1,
                                    time: 1500,
                                    shade: 0.3
                                }, function(){
                                    location.reload();
                                });
                            } else {
                                layer.msg(res.msg, {icon: 2, shade: 0.3});
                            }
                        },
                        error: function(){
                            layer.closeAll('loading');
                            layer.msg('操作失败，请稍后再试', {icon: 2, shade: 0.3});
                        }
                    });
                });
                
                return false;
            });
            
            // 处理URL参数中的提示信息
            const urlParams = new URLSearchParams(window.location.search);
            const message = urlParams.get('act');
            const type = urlParams.get('type');
            
            if (message) {
                let decodedMessage = message.replace(/\\u([\d\w]{4})/gi, (match, grp) => 
                    String.fromCharCode(parseInt(grp, 16))
                );
                decodedMessage = decodeURIComponent(decodedMessage);
                
                layer.msg(decodedMessage, {
                    icon: type === 'warning' ? 2 : 1,
                    time: 2000,
                    shade: 0.3
                });
            }
            
            // 添加页面加载动画
            document.addEventListener('DOMContentLoaded', function() {
                document.body.classList.add('opacity-100');
                document.body.classList.remove('opacity-0');
            });
        });
    </script>
