        <script>
               $('.user').click(function(){
            $.ajax({
            type: "POST",
            url: "/user/user",        
            dataType: "json",
                success: function(data){
                    if(data.code==0){
                          Swal.fire({
                                        icon: 'success',
                                        title: '成功',
                                        text: data.msg,
                                        confirmButtonColor: '#3b82f6'
                                    }).then(() => {
                                        // 刷新页面以更新余额
                                        location.reload();
                                    });
                         //  showNotification(data.msg);
                    setTimeout(function(){
                                    location.reload();
                                }, 1000);
                    }else{
                         showNotification(data.msg);
                    }
                }
            });
        });
              // 显示通知 - 优化弹窗位置使其居中
        function showNotification(message) {
            // 检测设备类型，手机端强制居中，电脑端可选择居中或默认位置
            const isMobile = window.innerWidth < 768;
            const position = isMobile ? 'center' : 'top-end';
            
            Swal.fire({
                position: position,
                icon: 'success',
                title: message,
                showConfirmButton: false,
                timer: 1500,
                // 添加自定义类名以增强居中效果
                customClass: {
                    container: 'swal2-center'
                }
            });
        }
        // 显示所有赠送的采集套餐名称
        function showAllCmsapiNames(packageId, names) {
            let html = `
                <div class="text-center mb-3">
                    <h4 class="font-bold">解析套餐ID: ${packageId}</h4>
                    <p class="text-sm text-gray-500">说明:购买解析套餐后自动发放,授权采集IP即可使用</p>
                </div>
                <div class="space-y-2">
            `;
            
            names.forEach((item) => {
                html += `
                    <div class="flex items-center p-2 bg-gray-50 rounded-lg">
                        <span class="text-gray-700">${item.cmsapi_name}</span>
                        <span class="ml-auto text-xs text-gray-500">采集ID: ${item.cmsapi_id}</span>
                    </div>
                `;    
            });
            
            html += `</div>`;
            
            Swal.fire({
                title: '赠送的采集接口',
                html: html,
                icon: 'info',
                confirmButtonText: '关闭',
                width: '400px',
                customClass: {
                    popup: 'rounded-xl',
                    title: 'text-lg font-bold',
                    content: 'text-sm'
                }
            });
        }
   
   
        // 确认购买套餐
        function confirmPurchase(packageId, packageName, packagePrice) {
            // 获取当前余额
            const currentBalance = parseFloat("{$user.money}");
            
            // 检查余额是否充足
            if (currentBalance < packagePrice) {
                Swal.fire({
                    title: '余额不足',
                    html: `
                        <p>您当前余额为：<strong>${currentBalance} 元</strong>，<br>
                        无法购买套餐：<strong>${packageName}</strong>，价格为：<strong>${packagePrice} 元</strong>。</p>
                        <p>请先充值后再购买。</p>
                    `,
                    icon: 'error',
                    showCancelButton: true,
                    confirmButtonText: '在线充值',
                    cancelButtonText: '卡密充值',
                    confirmButtonColor: '#3b82f6',
                    cancelButtonColor: '#6b7280'
                }).then((result) => {
                    if (result.isConfirmed) {
                        // 如果用户点击“在线充值”，跳转到在线充值页面
                           window.location.href = "/user/recharge";
                    } else if (result.dismiss === Swal.DismissReason.cancel) {
                        // 如果用户点击“卡密充值”，跳转到卡密充值页面
                        window.location.href = "/user/card/";
                    }
                });
            } else {
                Swal.fire({
                    title: '确认购买解析套餐？',
                    html: `
                        <p>您将购买解析套餐：</p>
                        <p class="font-bold my-2">${packageName}</p>
                        <p>套餐价格：<strong class="text-primary">${packagePrice} 元</strong></p>
                        <p>您当前余额：<strong>${currentBalance} 元</strong></p>
                    `,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonText: '确认购买',
                    cancelButtonText: '取消',
                    confirmButtonColor: '#3b82f6',
                    cancelButtonColor: '#6b7280',
                    focusCancel: true
                }).then((result) => {
                    if (result.isConfirmed) {
                        // 如果用户确认购买，则跳转到购买页面
                     //   window.location.href = `/shop/purChase?id=${packageId}`;
                     
                         $.ajax({
                    type: 'POST',
                    url: '/shop/purchase',
                    data: {id:packageId},
                      dataType: "json",
                    success: function(res){
                        if(res.code ===0){
                                   // 显示成功信息
        Swal.fire({
                                        icon: 'success',
                                        title: '成功',
                                        text: res.msg,
                                        confirmButtonColor: '#3b82f6'
                                    }).then(() => {
                                        // 刷新页面以更新余额
                                        location.reload();
                                    });
                        } else {
                            Swal.fire({
                                        icon: 'error',
                                        title: '失败',
                                        text: res.msg,
                                        confirmButtonColor: '#3b82f6'
                                    });
                        }
                    },
                    error: function(){
            ;
                     
                                    Swal.fire({
                                        icon: 'error',
                                        title: '请求失败，请检查网络后重试',
                                        text: '请求失败，请检查网络后重试',
                                        confirmButtonColor: '#3b82f6'
                                    });;
                    }
                });
                     
       
                  
                    }
                });
            }
        }
  
    </script>
