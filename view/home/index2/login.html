  <script>
    // 发送验证码功能
    $(document).ready(function() {
      // 验证码发送状态
      let isSending = false;
      let countdown = 60;
      let countdownTimer = null;
      
      // 确保DOM加载完成后绑定事件
      setTimeout(function() {
        // 点击发送验证码按钮
        $('#send-code-btn').on('click', function(e) {
          e.preventDefault();
          
          // 如果正在发送中，则不处理
          if (isSending) return;
          
          // 获取邮箱
          const email = $('#register-email').val().trim();
          
          // 验证邮箱格式
          if (!validateEmail(email)) {
            Swal.fire({
              title: '错误',
              text: '请输入有效的邮箱地址',
              icon: 'error',
              confirmButtonText: '确定',
              confirmButtonColor: '#165DFF'
            });
            return;
          }
          
          // 标记为正在发送
          isSending = true;
          $(this).prop('disabled', true).text('发送中...');
          
          // 发送验证码请求
          console.log('发送验证码请求:', email); // 调试输出
          
          $.ajax({
            url: '/ajax/code',
            type: 'POST',
            data: {
              email: email
            },
            dataType: 'json',
            success: function(response) {
              console.log('验证码请求响应:', response); // 调试输出
              
              if (response.code === 0) {
                // 显示成功消息
                Swal.fire({
                  title: '成功',
                  text: '验证码已发送，请查收',
                  icon: 'success',
                  confirmButtonText: '确定',
                  confirmButtonColor: '#165DFF'
                });
                
                // 开始倒计时
                startCountdown();
              } else {
                // 显示错误消息
                Swal.fire({
                  title: '错误',
                  text: response.msg || '发送验证码失败',
                  icon: 'error',
                  confirmButtonText: '确定',
                  confirmButtonColor: '#165DFF'
                });
                
                // 重置发送状态
                isSending = false;
                $('#send-code-btn').prop('disabled', false).text('发送验证码');
              }
            },
            error: function(xhr, status, error) {
              console.log('验证码请求错误:', status, error); // 调试输出
              
              // 显示错误消息
              Swal.fire({
                title: '错误',
                text: '发送验证码时发生错误',
                icon: 'error',
                confirmButtonText: '确定',
                confirmButtonColor: '#165DFF'
              });
              
              // 重置发送状态
              isSending = false;
              $('#send-code-btn').prop('disabled', false).text('发送验证码');
            }
          });
        });
      }, 500); // 延迟绑定确保元素已加载
      
      // 验证邮箱格式
      function validateEmail(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(email);
      }
      
      // 开始倒计时
      function startCountdown() {
        // 获取按钮元素
        const $btn = $('#send-code-btn');
        
        // 设置倒计时
        $btn.text(`重新发送(${countdown}s)`);
        
        // 清除之前的定时器
        if (countdownTimer) {
          clearInterval(countdownTimer);
        }
        
        // 启动新的定时器
        countdownTimer = setInterval(function() {
          countdown--;
          
          if (countdown <= 0) {
            // 倒计时结束
            clearInterval(countdownTimer);
            countdown = 60;
            
            // 恢复按钮状态
            $btn.prop('disabled', false);
            $btn.text('发送验证码');
            
            // 重置发送状态
            isSending = false;
          } else {
            // 更新按钮文本
            $btn.text(`重新发送(${countdown}s)`);
          }
        }, 1000);
      }
      
      // 防止表单默认提交行为
      $('form').on('submit', function(e) {
        e.preventDefault();
        return false;
      });
    });
  </script>
  
  <script>
    // 登录/注册表单切换
    const loginTab = document.getElementById('login-tab');
    const registerTab = document.getElementById('register-tab');
    const loginForm = document.getElementById('form1');
    const registerForm = document.getElementById('form2');
    const switchToRegister = document.getElementById('switch-to-register');
    const switchToLogin = document.getElementById('switch-to-login');
    
    function showLoginForm() {
      loginForm.classList.remove('hidden');
      registerForm.classList.add('hidden');
      loginTab.classList.add('text-primary', 'border-b-2', 'border-primary');
      loginTab.classList.remove('text-neutral-medium');
      registerTab.classList.add('text-neutral-medium');
      registerTab.classList.remove('text-primary', 'border-b-2', 'border-primary');
    }
    
    function showRegisterForm() {
      loginForm.classList.add('hidden');
      registerForm.classList.remove('hidden');
      loginTab.classList.remove('text-primary', 'border-b-2', 'border-primary');
      loginTab.classList.add('text-neutral-medium');
      registerTab.classList.remove('text-neutral-medium');
      registerTab.classList.add('text-primary', 'border-b-2', 'border-primary');
    }
    
    loginTab.addEventListener('click', showLoginForm);
    registerTab.addEventListener('click', showRegisterForm);
    switchToRegister.addEventListener('click', showRegisterForm);
    switchToLogin.addEventListener('click', showLoginForm);
    
    // 密码可见性切换
    document.querySelectorAll('button[type="button"]').forEach(button => {
      if (button.querySelector('i.fa-eye-slash') || button.querySelector('i.fa-eye')) {
        button.addEventListener('click', () => {
          const icon = button.querySelector('i');
          const input = button.parentElement.querySelector('input');
          
          if (icon.classList.contains('fa-eye-slash')) {
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
            input.type = 'text';
          } else {
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
            input.type = 'password';
          }
        });
      }
    });
  </script>

  <script>
    layui.use(['layer', 'form', 'admin', 'notice'], function () {
      var $ = layui.jquery;

      var form = layui.form;
      var admin = layui.admin;
      var notice = layui.notice;

      $('#loginBtn').click(function() {
        var user = $("input[name='user']").val();
        var pass = $("input[name='pass']").val();
        
        if(!user){
          notice.warning({
            message: '请填写用户名！',
            animateInside:true,
            position:'topCenter',
            transitionOut:'flipOutX',
            transitionOutMobile: 'flipOutX',
            displayMode:'2',
            audio:'1'
          });
          return false;
        }
        
        if(!pass){
          notice.warning({
            message: '请填写密码！',
            animateInside:true,
            position:'topCenter',
            transitionOut:'flipOutX',
            transitionOutMobile: 'flipOutX',
            displayMode:'2',
            audio:'1'
          });
          return false;
        }
        
        admin.btnLoading(' #loginBtn');
        admin.showLoading('#divLoading', 2, '.8');
        
        $.ajax({
          type: "post",
          url: "{:url('/ajax/login')}",
          data: $('#form1').serialize(), 
          dataType: "json",
          success: function(data) {
            if (data.code == 0) {
              notice.success({
                title: '登录通知',
                message: data.msg,
                animateInside:true,
                position:'topCenter',
                transitionOut:'flipOutX',
                transitionOutMobile: 'flipOutX',
                displayMode:'2',
                audio:'1'
              });
              
              setTimeout(function (){
                location.href="{:url('/user/index')}";
              }, 2000);
            } else {
              notice.error({
                title: '系统提示',
                message: data.msg,
                animateInside:true,
                position:'topCenter',
                transitionOut:'flipOutX',
                transitionOutMobile: 'flipOutX',
                displayMode:'2',
                audio:'1'
              });
            }
            
            admin.removeLoading('#divLoading', true, true);
            admin.btnLoading(' #loginBtn', false);
          }, 
          
          error: function () {
            notice.error({
              title: '系统提示',
              message: '服务器错误，请稍后重试~',
              animateInside:true,
              position:'topCenter',
              transitionOut:'flipOutX',
              transitionOutMobile: 'flipOutX',
              timeout:false,
              displayMode:'2',
              audio:'1'
            });
            
            admin.removeLoading('#divLoading', true, true);
            admin.btnLoading(' #loginBtn', false);
            return false;
          }
        });
      });

        admin.showLoading('#divLoading', 2, '.8');

          type: "post",
          url: "{:url('/ajax/reg')}",

                audio:'1'
              });
              
              setTimeout(function (){
                location.href="{:url('/user/index')}";
              }, 2000);
            } else {
              notice.error({
                title: '系统提示',
                message: data.msg,
                animateInside:true,
                position:'topCenter',
                transitionOut:'flipOutX',
                transitionOutMobile: 'flipOutX',
                displayMode:'2',
                audio:'1'
              });
            }
            
            admin.removeLoading('#divLoading', true, true);
            admin.btnLoading(' #regBtn', false);

            notice.error({
              title: '系统提示',
              message: '服务器错误，请稍后重试~',
              animateInside:true,
              position:'topCenter',
              transitionOut:'flipOutX',
              transitionOutMobile: 'flipOutX',
              timeout:false,
              displayMode:'2',
              audio:'1'
            });
            
            admin.removeLoading('#divLoading', true, true);
            admin.btnLoading(' #regBtn', false);
            return false;
          }
        });
      });
    });
  </script>
</body>
