<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>用户登录/注册 - {:conf('name')}</title>
    <link rel="stylesheet" href="/template/inside1/css/styles.css">
    <!-- 引入 Font Awesome 图标库 -->
    <link rel="stylesheet" href="../template/CDN/all.min.css">
    <!-- 引入 SweetAlert2 CSS -->
    <link rel="stylesheet" href="/template/CDN/css/sweetalert2.min.css">
    <script src="/template/CDN/js/jquery.min.js"></script>
    <!-- 引入 SweetAlert2 JS -->
    <script src="/template/CDN/js/sweetalert2.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="forms-container">
            <div class="signin-signup">
                <form name="form1" id='form1' autocomplete="off" class="sign-in-form">
                    <div class="logo-container">
                        <img class="logo" src="{:conf('logo')}" alt="{:conf('name')}">
                    </div>
                    <h2 class="title">用户注册</h2>
                    <div class="input-field">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="register-email" name="email" placeholder="邮箱" required>
                        <if conf('mailreg')==1>
                            <button name="codd" class="btn send-code-btn" id="send-code-btn">发送验证码</button>
                        </if>
                    </div>
                    <if conf('mailreg')==1>
                        <div class="input-field">
                            <i class="fas fa-user"></i>
                            <input type="text" id="register-username" name="code" placeholder="验证码" >
                        </div>     
                    </if>
                    <div class="input-field">
                        <i class="fas fa-user"></i>
                        <input type="text" id="register-username" name="user" placeholder="用户名" required>
                    </div>
                    <div class="input-field">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="register-password" name="pass" placeholder="密码" required>
                    </div>
  
                    <div class="input-field">
                        <i class="fas fa-user"></i>
                        <input type="text" id="register-jxname" name="jxname" placeholder="解析平台名" required>
                    </div>
                     <div class="input-field">
                        <i class="fas fa-user"></i>
                        <input type="text" id="register-username" name="codes" placeholder="验证码" required>
                          <img src="{:url('/captcha')}" alt="验证码" onclick="this.src='{:url('/captcha')}?'+Math.random()">
                    </div>
                    <input type="submit" value="点 我 注 册" class="btn" id="loginBtn">
                    <!-- 服务条款提示 -->
                    <p class="terms-text">注册即代表同意<a href='/service.html' target='_blank'>服务条款</a></p>
                    <p class="terms-text">
                        <a href="/" class="terms-text">返回首页</a>
                    </p>
                </form>
            </div>
        </div>

        <div class="panels-container">
            <div class="panel left-panel">
                <div class="content">
                    <h3>已有账户？</h3>
                    <p>欢迎回来{:conf('name')}！请登录您的账户。</p>
                    <button class="btn transparent" id="sign-in-btn">登 录 账 号</button>
                </div>
                <img src="/template/inside1/img/dm_red.webp" class="image" alt="">
            </div>
        </div>
    </div>

<script>
    // 发送验证码功能
    $(document).ready(function() {
        // 验证码发送状态
        let isSending = false;
        let countdown = 60;
        let countdownTimer = null;
        
        // 点击发送验证码按钮
        $('#send-code-btn').on('click', function(e) {
            e.preventDefault(); // 阻止表单默认提交行为
            
            // 如果正在发送中，则不处理
            if (isSending) return;
            
            // 获取邮箱
            const email = $('#register-email').val().trim();
            
            // 验证邮箱格式
            if (!validateEmail(email)) {
                Swal.fire({
                    title: '错误',
                    text: '请输入有效的邮箱地址',
                    icon: 'error',
                    confirmButtonText: '确定'
                });
                return;
            }
            
            // 标记为正在发送
            isSending = true;
            
            // 发送验证码请求
            $.ajax({
                url: '/ajax/code', // 
                type: 'POST',
                data: {
                    email: email
                },
                dataType: 'json',
                success: function(response) {
                    if (response.code === 0) {
                        // 显示成功消息
                        Swal.fire({
                            title: '成功',
                            text: '验证码已发送，请查收',
                            icon: 'success',
                            confirmButtonText: '确定'
                        });
                        
                        // 开始倒计时
                        startCountdown();
                    } else {
                        // 显示错误消息
                        Swal.fire({
                            title: '错误',
                            text: response.msg || '发送验证码失败',
                            icon: 'error',
                            confirmButtonText: '确定'
                        });
                        
                        // 重置发送状态
                        isSending = false;
                    }
                },
                error: function(xhr, status, error) {
                    // 显示错误消息
                    Swal.fire({
                        title: '错误',
                        text: '发送验证码时发生错误',
                        icon: 'error',
                        confirmButtonText: '确定'
                    });
                    
                    // 重置发送状态
                    isSending = false;
                }
            });
        });
        
        // 验证邮箱格式
        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }
        
        // 开始倒计时
        function startCountdown() {
            // 修改按钮文本和禁用状态
            const $btn =$('#send-code-btn');
            $btn.prop('disabled', true);
            
            // 设置倒计时
            $btn.text(`重新发送(${countdown}s)`);
            
            // 清除之前的定时器
            if (countdownTimer) {
                clearInterval(countdownTimer);
            }
            
            // 启动新的定时器
            countdownTimer = setInterval(function() {
                countdown--;
                
                if (countdown <= 0) {
                    // 倒计时结束
                    clearInterval(countdownTimer);
                    countdown = 60;
                    
                    // 恢复按钮状态
                    $btn.prop('disabled', false);
                    $btn.text('发送验证码');
                    
                    // 重置发送状态
                    isSending = false;
                } else {
                    // 更新按钮文本
                    $btn.text(`重新发送(${countdown}s)`);
                }
            }, 1000);
        }
    });
</script>
         <script type="text/javascript" src="{__LIBS__}layui/layui.js"></script>
<script type="text/javascript" src="{__JS__}common.js?v=318"></script>
<script>
  layui.use(['layer', 'form', 'admin', 'notice'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var form = layui.form;
        var admin = layui.admin;
        var notice = layui.notice;
   $('#sign-up-btn').click(function() {
       window.location.href = "/index/login";
   });
   $('#loginBtn').click(function() {
                admin.btnLoading(' #loginBtn');
                admin.showLoading('#divLoading', 2, '.8');
                $.ajax({
                    type: "post",
                    url: "{:url('/ajax/reg')}",
                     data:$('#form1').serialize(), 
                    dataType: "json",
                    success: function(data) {
                        if (data.code == 0) {
                            notice.success({
                                title: '注册通知',
                                message: data.msg,
                                animateInside:true,
                                position:'topCenter',
                                transitionOut:'flipOutX',
                                transitionOutMobile: 'flipOutX',
                                displayMode:'2',
                                audio:'1'
                            });
                            setTimeout(function (){
                        
                               location.href="{:url('/user/index')}";
                            
                            },2000)
                        } else {
                            notice.error({
                                title: '系统提示您',
                                message: data.msg,
                                animateInside:true,
                                position:'topCenter',
                                transitionOut:'flipOutX',
                                transitionOutMobile: 'flipOutX',
                                displayMode:'2',
                                audio:'1'
                            });
                        }
                        admin.removeLoading('#divLoading', true, true);
                        admin.btnLoading(' #loginBtn', false);
                    }, error: function () {
                        notice.error({
                            title: '系统提示您',
                            message: '服务器错误，请稍后重试~',
                            animateInside:true,
                            position:'topCenter',
                            transitionOut:'flipOutX',
                            transitionOutMobile: 'flipOutX',
                            timeout:false,
                            displayMode:'2',
                            audio:'1'
                        });
                        admin.removeLoading('#divLoading', true, true);
                        admin.btnLoading(' #loginBtn', false);
                        return false;
                    }
                });
            });
       
    });

</script>
</body>
</html>
