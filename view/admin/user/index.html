<include file="/public/header">
<!-- 正文开始 -->
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body">
            <!-- 表格工具栏 -->
     <form class="layui-form toolbar">
                <div class="layui-form-item">
               <div class="layui-inline">
                        <label class="layui-form-label">内&emsp;容</label>
                        <div class="layui-input-inline">
                            <input name="key" class="layui-input" placeholder="输入ID或名称"/>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">条&emsp;件&emsp;</label>
                        <div class="layui-input-inline">
                            <select name="type" class="ew-select-fixed">
                                <option value="">选择条件</option>
                            
                                <option value="1">用户名</option>
                                <option value="2">QQ</option>
                            </select>
                        </div>
                    </div>
                       <div class="layui-inline">
                        <label class="layui-form-label">消&emsp;费&emsp;</label>
                        <div class="layui-input-inline">
                            <select name="consumption" class="ew-select-fixed">
                                <option value="">选择条件</option>
                            
                                <option value="1">充值点数</option>
                                <option value="2">充值日限</option>
                              
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-btn-container">&emsp;&emsp;
                        <button class="layui-btn icon-btn" lay-filter="Sk_TbSearch" lay-submit>
                            <i class="layui-icon">&#xe615;</i>搜索
                        </button>
                    </div>
            </div>
        
            </form>
            <!-- 数据表格 -->
            <table id="Sk_Table" lay-filter="Sk_Table"></table>
        </div>
    </div>
</div>
<!-- 表格操作列 -->
<script type="text/html" id="Sk_TbBar">
   <a class="layui-btn layui-btn layui-btn-xs" lay-event="edit">修改</a>
    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
</script>
<!-- 表格状态列 -->
<script type="text/html" id="Sk_TbState">
    <input type="checkbox" lay-filter="Sk_TbStateCk" value="{{d.id}}" lay-skin="switch"
           lay-text="正常|封禁" {{d.state==1?'checked':''}} style="display: none;"/>
    <p style="display: none;">{{d.type==0?'正常':'封禁'}}</p>
</script>
<!-- 表单弹窗 -->
<script type="text/html" id="Sk_commission">
    <form id="Sk_commission" lay-filter="Sk_commission" class="layui-form model-form">
        <input name="id" type="hidden"/>
  <div class="layui-form-item">
                                <label class="layui-form-label">操作金额</label>
                                <div class="layui-input-block">
                                    <input type="number" class="layui-input" name="money" placeholder="金额">
                                </div>
                            </div>
                             <div class="layui-form-item">
       <label class="layui-form-label">方式</label>
       <div class="layui-input-block">
           <input type="radio" name="ttttt" value="1" title="加款" checked >
           <input type="radio" name="ttttt" value="2" title="扣款" >
          
        </div>
         </div>
        <div class="layui-form-item text-right">
            <button class="layui-btn" lay-filter="Sk_commissionSubmit" lay-submit>保存</button>
            <button class="layui-btn layui-btn-primary" type="button" ew-event="closeDialog">取消</button>
        </div>
    </form>
</script>

<include file="/public/footer">
<script>
    layui.use(['layer', 'form','layedit', 'table', 'util', 'admin', 'notice', 'laydate'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var form = layui.form;
        var table = layui.table;
        var util = layui.util;
        var admin = layui.admin;
        var notice = layui.notice;
         var layedit = layui.layedit;
           var laydate = layui.laydate;
             layedit.build('demo'); //建立编辑器

        /* 渲染表格 */
        var insTb = table.render({
            elem: '#Sk_Table',
            url: '{:url("/User/list")}',
            method: 'post',
            page: true,
            skin: 'line',
            size: 'lg',
            toolbar: ['<p>',
                '<button lay-event="add" class="layui-btn layui-btn-sm icon-btn"><i class="layui-icon">&#xe654;</i>开通</button>&nbsp;',
     
                '<button lay-event="del" class="layui-btn layui-btn-sm layui-btn-danger icon-btn"><i class="layui-icon">&#xe640;</i>删除</button>',
                '</p>'].join(''),
            cellMinWidth: 100,
            request: {
                pageName: 'current_page' //页码的参数名称，默认：page
                ,limitName: 'limit' //每页数据量的参数名，默认：limit
            } ,
            parseData: function(res){ //res 即为原始返回的数据
                return {
                    "code": res.code, //解析接口状态
                    "msg": res.msg, //解析提示文本
                    "count": res.data.data.total, //解析数据长度
                    "data": res.data.data.data //解析数据列表
                };
            },
            cols: [[
                {type: 'checkbox'},
                {field: 'id', title: 'ID'},
                {field: 'uid', title: 'UID', align: 'left',  minWidth: 120},
                {field: 'user', title: '用户名', align: 'left',  minWidth: 120},
                 {field: 'email', title: '邮箱',  minWidth: 160},
                  {field: 'access_token', title: 'QQ绑定', minWidth: 100, templet: function (d) {
                    if(d.access_token!=null){
                        return '<a lay-event="jcqq" class="layui-btn layui-btn-xs layui-btn-danger">点击解除</a>';
                    }else{
                     return '未绑定QQ';   
                    }
                    }
                },
                {field: 'access_token_wx', title: '微信绑定', minWidth: 100, templet: function (d) {
                    if(d.access_token_wx!=null){
                        return '<a lay-event="jcwx" class="layui-btn layui-btn-xs layui-btn-danger">点击解除</a>';
                    }else{
                     return '未绑定微信';
                    }
                    }
                },
              {field: 'sjuser', title: '代理',  minWidth: 160},
                {field: 'client_name', title: '解析平台名',  minWidth: 160},
                {field: 'bytime', title: '剩余',  minWidth: 160},
              {field: 'money', title: '余额', sort: true, minWidth: 130, templet: function (d) {
                        return '<span class="layui-badge layui-badge-green" lay-event="commission">'+d.money+'</span>';
                    },
                },
                 {field: 'daynum', title: '今日调用',  minWidth: 160},
                {field: 'way', title: '用户类型',  minWidth: 160},
                {field: 'ip', title: '注册ip',  minWidth: 160},
            {field: 'time', title: '注册时间',  minWidth: 160},
             {field: 'auth_ip', title: '解析授权IP',  minWidth: 160},
              {field: 'cj_auth_ip', title: '采集授权IP',  minWidth: 160},
      
                {field: 'state', title: '状态', templet: '#Sk_TbState', sort: true, minWidth: 100},
        
               
                {title: '操作', toolbar: '#Sk_TbBar',fixed: 'right', align: 'center', minWidth: 180}
            ]]
        });
       
       
        /* 表格搜索 */
        form.on('submit(Sk_TbSearch)', function (data) {
            insTb.reload({where: data.field, page: {curr: 1}});
            return false;
        });

        form.on('radio(authority)', function (data) {
            if(data.value ==2||data.value ==3){
              $("#form_data").css("display", "");
               
            }else{
             $("#form_data").css("display", "none");
          
            }
            return false;
        });
       
            /* 表格工具条点击事件 */
            table.on('tool(Sk_Table)', function (obj) {
                if (obj.event === 'edit') {
                    showEditModel(obj.data);
                } else if (obj.event === 'del') {
                    doDel(obj);
                } else if (obj.event === 'commission') {
                    commission(obj.data);
                } else if (obj.event === 'jcqq') {
                    jcqq(obj.data.id);
                } else if (obj.event === 'jcwx') {
                    jcwx(obj.data.id);
                }
            });

            /* 解绑QQ */
            function jcqq(obj) {
                layer.confirm('确定要解除该用户QQ的快捷登录吗？', {
                    skin: 'layui-layer-admin',
                    icon: 3,
                    shade: .1
                }, function (i) {
                    layer.close(i);
                    notice.msg('正在执行中..', {icon: 4, close: true});
                    $.ajax({
                        type: "POST",
                        url: '{:url("/User/secureqq")}',
                        data: {id: obj},
                        dataType: "json",
                        success: function(data) {
                            notice.destroy();
                            if (data.code == 0) {
                                insTb.reload({page: {curr: 1}});
                                notice.msg(data.msg, {icon: 1, audio:'1'});
                            }else{
                                notice.msg(data.msg, {icon: 2, audio:'1'});
                            }
                        },
                        error: function() {
                            notice.destroy();
                            notice.msg("服务器错误！", {icon: 2, audio:'1'});
                        }
                    });
                });
            }
              /* 解绑微信 */
            function jcwx(obj) {
                layer.confirm('确定要解除该用户的微信登录吗？', {
                    skin: 'layui-layer-admin',
                    icon: 3,
                    shade: .1
                }, function (i) {
                    layer.close(i);
                    notice.msg('正在执行中..', {icon: 4, close: true});
                    $.ajax({
                        type: "POST",
                        url: '{:url("/User/securewx")}',
                        data: {id: obj},
                        dataType: "json",
                        success: function(data) {
                            notice.destroy();
                            if (data.code == 0) {
                                insTb.reload({page: {curr: 1}});
                                notice.msg(data.msg, {icon: 1, audio:'1'});
                            }else{
                                notice.msg(data.msg, {icon: 2, audio:'1'});
                            }
                        },
                        error: function() {
                            notice.destroy();
                            notice.msg("服务器错误！", {icon: 2, audio:'1'});
                        }
                    });
                });
            }
            /* 表格头工具栏点击事件 */
            table.on('toolbar(Sk_Table)', function (obj) {
                if (obj.event === 'add') {
                    showEditModel();
                } else if (obj.event === 'del') {
                    var checkRows = table.checkStatus('Sk_Table');
                    if (checkRows.data.length === 0) {
                        notice.msg('请选择要删除的数据！', {icon: 3, audio:'1'});
                        return;
                    }
                    var ids = checkRows.data.map(function (d) {
                        return d.id;
                    });
                    doDel({ids: ids});
                }
            });

             /* 显示表单弹窗 */
        function showEditModel(mData) {
            var id = mData && mData.id || '';
            admin.popupRight({
                type: 2,
                title: (mData ? '修改' : '添加') + '用户',
                area: ['95%', '90%'],
                 content: '{:url("/user/details")}?id='+id
            
            });
        }
            function commission(mData) {
                admin.popupRight({
                    type: 1,
                    title:'加款',
                    area: ['550px', '560px'],
                    content: $('#Sk_commission').html(),
                    success: function (layero, dIndex) {
                        // 回显表单数据
                        if(mData){
                            $("#form_data").css("display", "inherit");
                             form.render();
                                    form.val('Sk_commission', mData);
                        }else{
                            form.render();
                            $("#form_data").css("display","none");
                        }
                        // 表单提交事件
                        form.on('submit(Sk_commissionSubmit)', function (data) {
                            notice.msg('正在执行中..', {icon: 4, close: true});
                            $.ajax({
                                type: "POST",
                                url: '{:url("/User/commission")}',
                                data: data.field,
                                dataType: "json",
                                success: function(data) {
                                    notice.destroy();
                                    if (data.code == 0) {
                                        table.reload('Sk_Table');
                                        notice.msg(data.msg, {icon: 1, audio:'1'});
                                    } else {
                                        notice.msg(data.msg, {icon: 2, audio:'1'});
                                    }
                                },
                                error: function() {
                                    notice.destroy();
                                    notice.msg("服务器错误！", {icon: 2, audio:'1'});
                                }
                            });
                            return false;
                        });
                        // 禁止弹窗出现滚动条
                        $(layero).children('.layui-layer-content').css('overflow', 'visible');
                    }
                });
            }
          
            /* 删除 */
            function doDel(obj) {
                layer.confirm('确定要删除选中数据吗？', {
                    skin: 'layui-layer-admin',
                    icon: 3,
                    shade: .1
                }, function (i) {
                    layer.close(i);
                    notice.msg('正在执行中..', {icon: 4, close: true});
                    $.ajax({
                        type: "POST",
                        url: obj.data ? '{:url("/User/del")}' : '{:url("/User/del")}',
                        data: {id: obj.data ? obj.data.id : obj.ids.join(',')},
                        dataType: "json",
                        success: function(data) {
                            notice.destroy();
                            if (data.code == 0) {
                                insTb.reload({page: {curr: 1}});
                                notice.msg(data.msg, {icon: 1, audio:'1'});
                            }else{
                                notice.msg(data.msg, {icon: 2, audio:'1'});
                            }
                        },
                        error: function() {
                            notice.destroy();
                            notice.msg("服务器错误！", {icon: 2, audio:'1'});
                        }
                    });
                });
            }


            /* 修改用户状态 */
            form.on('switch(Sk_TbStateCk)', function (obj) {
                notice.msg('正在执行中..', {icon: 4, close: true});
                $.ajax({
                    type: "POST",
                    url:'{:url("/User/status")}',
                    data: {id:obj.value,status:obj.elem.checked ? 1 : 0},
                    dataType: "json",
                    success: function(data) {
                        notice.destroy();
                        if (data.code == 0) {
                            insTb.reload({page: {curr: 1}});
                            notice.msg(data.msg, {icon: 1, audio:'1'});
                        }else{
                            notice.msg(data.msg, {icon: 2, audio:'1'});
                        }
                    },
                    error: function() {
                        notice.destroy();
                        notice.msg("服务器错误！", {icon: 2, audio:'1'});
                    }
                });
            });
     
        });
</script>
