        // 复制成功提示
        document.addEventListener('click', function(e) {
            if (e.target.closest('.copy-text')) {
                const button = e.target.closest('.copy-text');
                button.innerHTML = '<i class="fa fa-check mr-1"></i> 已复制';
                button.classList.add('text-success');
                
                setTimeout(() => {
                    button.innerHTML = '<i class="fa fa-copy mr-1"></i> 点我复制';
                    button.classList.remove('text-success');
                }, 2000);
            }
        });

    <script>
        layui.use(['form', 'table', 'layer'], function(){
            var form = layui.form;
            var layer = layui.layer;
             var $ = layui.jquery;
             var table = layui.table;

            form.on('submit(Forma)', function(data){
                layer.load(1);
                $.ajax({
                    type: 'POST',
                    url: '/user/update',
                       data: data.field,
                      dataType: "json",
                    success: function(res){
                        layer.closeAll('loading');
                        if(res.code ===0){
                            layer.msg(res.msg, {icon: 1});
                        } else {
                            layer.msg(res.msg, {icon: 2});
                        }
                    },
                    error: function(){
                        layer.closeAll('loading');
                        layer.msg('操作失败，请稍后再试', {icon: 2});
                    }
                });
                return false;

        });
