<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>解析记录-{:conf('name')}</title>
   <script src="{template}/inside1/css/3.4.16"></script>
    <link href="{template}/inside1/css/font-awesome.min.css" rel="stylesheet">
    <script src="{template}/inside1/css/sweetalert2.all.min.js"></script>
    <link href="{template}/inside1/css/sweetalert2.min.css" rel="stylesheet">

    <!-- 引入Clipboard.js用于复制功能 -->
        <include file="/public/header">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#60a5fa',
                        success: '#10b981',
                        danger: '#ef4444',
                        warning: '#f59e0b',
                        info: '#3b82f6',
                        glass: 'rgba(255, 255, 255, 0.85)',
                        glassBorder: 'rgba(255, 255, 255, 0.4)',
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .glass-card {
                @apply bg-glass border border-glassBorder rounded-xl shadow-sm hover:shadow-md transition-all duration-300 backdrop-blur-sm;
            }
            .input-focus {
                @apply focus:border-primary focus:ring-2 focus:ring-primary/20 focus:outline-none transition-all;
            }
            .btn-primary {
                @apply bg-primary text-white font-medium py-2 px-4 rounded-lg shadow-md hover:bg-primary/90 hover:shadow-lg transition-all duration-300;
            }
            .btn-secondary {
                @apply bg-gray-200 text-gray-800 font-medium py-2 px-4 rounded-lg shadow-sm hover:bg-gray-300 transition-all duration-300;
            }
            .table-hover-row {
                @apply hover:bg-gray-50 transition-colors duration-200;
            }
            .card-hover {
                @apply transition-all duration-300 hover:shadow-lg hover:-translate-y-1;
            }
            .badge-success {
                @apply bg-green-100 text-green-800 px-2 py-1 rounded-full text-xs font-medium;
            }
            .badge-error {
                @apply bg-red-100 text-red-800 px-2 py-1 rounded-full text-xs font-medium;
            }
            .pagination-btn {
                @apply px-3 py-1.5 rounded-md border border-gray-300 text-gray-700 hover:bg-gray-50 transition-colors duration-200;
            }
            .pagination-active {
                @apply bg-primary text-white border-primary;
            }
        }
           
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-inter">
    <main class="container mx-auto px-4 py-6">

        
        <!-- 今日解析记录卡片 -->
        <div class="glass-card mb-6 card-hover">
            <div class="p-6">
                <div class="flex items-center mb-4">
                    <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center mr-3">
                        <i class="fa fa-history text-blue-600 text-xl"></i>
                    </div>
                    <h2 class="text-lg font-bold text-gray-800">你今日解析记录</h2>
                </div>
                
                <div class="overflow-x-auto">
                 <table id="SK_Table" lay-filter="SK_Table"></table>
                </div>
        
            </div>
        </div>
        
        <!-- 最受欢迎视频地址排行榜卡片 -->
        <div class="glass-card mb-6 card-hover">
            <div class="p-6">
                <div class="flex items-center mb-4">
                    <div class="w-10 h-10 rounded-full bg-green-100 flex items-center justify-center mr-3">
                        <i class="fa fa-star text-green-600 text-xl"></i>
                    </div>
                    <h2 class="text-lg font-bold text-gray-800">今日全站最受欢迎视频地址成功次数排行榜</h2>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead>
                            <tr>
                                <th class="px-4 py-3 bg-gray-50 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">视频地址URL</th>
                                <th class="px-4 py-3 bg-gray-50 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">成功次数</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                           <volist name="cg" id="v">
                             <tr class="table-hover-row">
                                        <td class="px-4 py-3 text-sm text-gray-500 truncate max-w-md">{$v.url|htmlspecialchars}</td>
                                        <td class="px-4 py-3 whitespace-nowrap text-sm font-medium text-gray-900">{$v.num}</td>
                                      </tr>
                     </volist>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <!-- 解析失败错误地址排行榜卡片 -->
        <div class="glass-card card-hover">
            <div class="p-6">
                <div class="flex items-center mb-4">
                    <div class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center mr-3">
                        <i class="fa fa-exclamation-triangle text-red-600 text-xl"></i>
                    </div>
                    <h2 class="text-lg font-bold text-gray-800">今日解析失败错误地址次数排行榜</h2>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead>
                            <tr>
                                <th class="px-4 py-3 bg-gray-50 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">视频地址URL</th>
                                <th class="px-4 py-3 bg-gray-50 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">失败次数</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                                 <volist name="sb" id="v">
                             <tr class="table-hover-row">
                                        <td class="px-4 py-3 text-sm text-gray-500 truncate max-w-md">{$v.url|htmlspecialchars}</td>
                                        <td class="px-4 py-3 whitespace-nowrap text-sm font-medium text-gray-900">{$v.num}</td>
                                      </tr>
                     </volist>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
 <script type="text/javascript" src="/Assets/libs/layui/layui.js"></script>
<script type="text/javascript" src="/Assets/js/common.js?v=318"></script>
    <script>
        layui.use(['form', 'table', 'layer'], function(){
            var form = layui.form;
            var layer = layui.layer;
             var $ = layui.jquery;
             var table = layui.table;
 
   /* 渲染表格 */
        var insTb = table.render({
            elem: '#SK_Table',
            url: '{:url("/user/recordList")}',
            method: 'post',
            page: true,
            skin: 'line',
            size: 'lg',
    
            cellMinWidth: 100,
            request: {
                pageName: 'current_page' //页码的参数名称，默认：page
                ,limitName: 'limit' //每页数据量的参数名，默认：limit
            },
            parseData: function(res){ //res 即为原始返回的数据
                return {
                    "code": res.code, //解析接口状态
                    "msg": res.msg, //解析提示文本
                    "count": res.data.data.total, //解析数据长度
                    "data": res.data.data.data //解析数据列表
                };
            },
            cols: [[
        
            
           {field: 'uid', title: 'UID',  minWidth: 100},
           {field: 'url', title: 'URL',  minWidth: 260},
           {field: 'ip', title: 'IP',  minWidth: 160},
              {field: 'intime', title: '时间',  minWidth: 160},
              {field: 'uselogjxtime', title: '耗时',  minWidth: 160},
           {field: 'status', title: '状态', minWidth: 100, templet: function (d) {
               if(String(d.status).indexOf('成功') === 0){
                        return '<span class="badge-success">成功</span>';
               }else{
                    return '<span class="badge-error">失败</span>';
               }
                    }},
            ]]
        });
        });
        
   
    </script>
</body>
</html>
