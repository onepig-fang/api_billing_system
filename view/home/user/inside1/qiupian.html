<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的求片管理</title>
  <!-- 引入外部资源 -->
  <script src="{template}/inside1/css/3.4.16"></script>
  <link href="{template}/inside1/css/font-awesome.min.css" rel="stylesheet">
  
  <!-- 配置Tailwind自定义颜色和字体 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#165DFF',
            secondary: '#4080FF',
            dark: '#0E42D2',
            light: '#E8F3FF',
            neutral: {
              100: '#F5F7FA',
              200: '#E5E6EB',
              300: '#C9CDD4',
              400: '#86909C',
              500: '#4E5969',
              600: '#272E3B',
              700: '#1D2129',
            }
          },
          fontFamily: {
            inter: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      }
    }
  </script>
  
  <!-- 自定义工具类 -->
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .glass {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.18);
      }
      .glass-nav {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      .card-hover {
        transition: all 0.3s ease;
        opacity: 0;
      }
      .fade-in {
        animation: fadeIn 0.5s ease forwards;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .loading {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid rgba(22, 93, 255, 0.3);
        border-radius: 50%;
        border-top-color: #165DFF;
        animation: spin 1s ease-in-out infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    }
  </style>
</head>
<body class="font-inter bg-gradient-to-br from-light to-white text-neutral-700 min-h-screen flex flex-col">

  <!-- 主内容区 -->
  <main class="flex-1 container mx-auto px-4 py-4 md:py-6">
    <!-- 页面标题和操作区 -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-6">
      <div>
        <h1 class="text-[clamp(1.5rem,3vw,2.2rem)] font-bold text-neutral-700">我的求片管理</h1>
        <p class="text-neutral-500 mt-1">查看和管理您的所有影片请求</p>
      </div>
      <button id="new-request-btn" class="mt-4 md:mt-0 px-5 py-2.5 bg-primary hover:bg-dark text-white rounded-lg shadow-sm hover:shadow transition-all flex items-center justify-center">
        <i class="fa fa-plus mr-2"></i>
        <span>在线立即求片</span>
      </button>
    </div>
    
    <!-- 状态统计卡片 -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      <div class="glass rounded-xl p-4 shadow-sm card-hover hover:shadow-md">
        <div class="text-center">
          <p class="text-neutral-500 text-sm">总请求</p>
          <h3 class="text-2xl font-bold mt-1 text-neutral-700">{$total}</h3>
          <div class="w-10 h-1 bg-primary/30 mx-auto mt-2 rounded-full overflow-hidden">
            <div class="h-full bg-primary rounded-full" style="width: 100%"></div>
          </div>
        </div>
      </div>
      
      <div class="glass rounded-xl p-4 shadow-sm card-hover hover:shadow-md">
        <div class="text-center">
          <p class="text-neutral-500 text-sm">处理中</p>
          <h3 class="text-2xl font-bold mt-1 text-blue-500">{$status1}</h3>
          <div class="w-10 h-1 bg-blue-200 mx-auto mt-2 rounded-full overflow-hidden">
            <div class="h-full bg-blue-500 rounded-full" style="width: {$type1Percent}%"></div>
          </div>
        </div>
      </div>
      
      <div class="glass rounded-xl p-4 shadow-sm card-hover hover:shadow-md">
        <div class="text-center">
          <p class="text-neutral-500 text-sm">已完成</p>
          <h3 class="text-2xl font-bold mt-1 text-green-500">{$status2}</h3>
          <div class="w-10 h-1 bg-green-200 mx-auto mt-2 rounded-full overflow-hidden">
            <div class="h-full bg-green-500 rounded-full" style="width:{$type2Percent}%"></div>
          </div>
        </div>
      </div>
      
      <div class="glass rounded-xl p-4 shadow-sm card-hover hover:shadow-md">
        <div class="text-center">
          <p class="text-neutral-500 text-sm">已拒绝</p>
          <h3 class="text-2xl font-bold mt-1 text-red-500">{$status3}</h3>
          <div class="w-10 h-1 bg-red-200 mx-auto mt-2 rounded-full overflow-hidden">
            <div class="h-full bg-red-500 rounded-full" style="width: {$type3Percent}%"></div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- 搜索和筛选区 -->
    <div class="glass rounded-xl p-4 mb-6 shadow-sm">
      <div class="flex flex-col md:flex-row gap-4">
        <!-- 搜索框 -->
        <div class="relative flex-1">
          <input type="text" id="search-input" placeholder="搜索您的求片..." 
                class="w-full py-2.5 px-4 pr-10 rounded-lg bg-white/70 border border-neutral-200 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition-all">
          <button id="search-btn" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-neutral-400 hover:text-primary transition-colors">
            <i class="fa fa-search"></i>
          </button>
        </div>
        
        <!-- 筛选器 -->
        <div class="flex flex-wrap gap-3">
          <select id="status-filter" class="bg-white/70 border border-neutral-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary">
            <option value="">全部状态</option>
            <option value="1">处理中</option>
            <option value="2">已完成</option>
            <option value="3">已拒绝</option>
          </select>
          
          <select id="type-filter" class="bg-white/70 border border-neutral-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary">
            <option value="">全部类型</option>
            <option value="1">电影</option>
            <option value="2">电视剧</option>
            <option value="3">纪录片</option>
            <option value="4">动漫</option>
            <option value="5">其他</option>
          </select>
          <input hidden=""   id="sort-filter" >
       <!--   <select id="sort-filter" class="bg-white/70 border border-neutral-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary">
            <option value="latest">最新请求</option>
            <option value="earliest">最早请求</option>
            <option value="upcoming">即将完成</option>
          </select>-->
        </div>
      </div>
    </div>
    
    <!-- 求片列表 -->
    <div class="mb-8">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-neutral-700">我的求片记录</h2>
        <span id="record-count" class="text-sm text-neutral-500">共 0 条记录</span>
      </div>
      
      <!-- 加载状态 -->
      <div id="loading-indicator" class="hidden text-center py-10">
        <div class="loading mx-auto"></div>
        <p class="mt-2 text-neutral-500">正在加载数据...</p>
      </div>
      
      <!-- 空状态 -->
      <div id="empty-state" class="hidden text-center py-10">
        <i class="fa fa-film text-5xl text-neutral-300 mb-3"></i>
        <p class="text-neutral-500">暂无求片记录</p>
      </div>
      
      <!-- 错误状态 -->
      <div id="error-state" class="hidden text-center py-10">
        <i class="fa fa-exclamation-circle text-5xl text-red-400 mb-3"></i>
        <p class="text-neutral-500 mb-2">加载失败</p>
        <button id="retry-btn" class="text-primary hover:text-dark text-sm font-medium transition-colors">
          重试
        </button>
      </div>
      
      <!-- 求片项目网格 -->
      <div id="request-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- 内容将通过JavaScript动态加载 -->
      </div>
      
      <!-- 加载更多 -->
      <div class="mt-6 text-center">
        <button id="load-more-btn" class="px-6 py-2.5 border border-primary text-primary hover:bg-primary hover:text-white rounded-lg transition-colors flex items-center justify-center mx-auto">
          <i class="fa fa-refresh mr-2"></i>
          <span>加载更多</span>
        </button>
      </div>
    </div>
    
    
    <!-- 求片指南 -->
    <div class="glass rounded-xl p-5 mb-8 shadow-sm">
      <h2 class="text-lg font-bold text-neutral-700 mb-4">求片指南</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="flex flex-col items-center text-center p-3 rounded-lg hover:bg-white/50 transition-colors">
          <div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center text-primary mb-3">
            <i class="fa fa-file-text-o text-xl"></i>
          </div>
          <h3 class="font-medium mb-2">如何发起请求</h3>
          <p class="text-sm text-neutral-500">点击"发起新请求"按钮，填写影片信息和您的需求，提交即可。</p>
        </div>
        
        <div class="flex flex-col items-center text-center p-3 rounded-lg hover:bg-white/50 transition-colors">
          <div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center text-primary mb-3">
            <i class="fa fa-clock-o text-xl"></i>
          </div>
          <h3 class="font-medium mb-2">处理时间</h3>
          <p class="text-sm text-neutral-500">一般请求会在3-7个工作日内处理完成，您可以随时查看进度。</p>
        </div>
        
        <div class="flex flex-col items-center text-center p-3 rounded-lg hover:bg-white/50 transition-colors">
          <div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center text-primary mb-3">
            <i class="fa fa-question-circle text-xl"></i>
          </div>
          <h3 class="font-medium mb-2">常见问题</h3>
          <p class="text-sm text-neutral-500">查看帮助中心了解更多求片相关问题，或联系客服获取支持。</p>
        </div>
      </div>
    </div>
  </main>

  
  <!-- 详情模态框 -->
  <div id="detail-modal" class="fixed inset-0 z-50 hidden overflow-y-auto">
    <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
      <!-- 背景遮罩 -->
      <div class="fixed inset-0 transition-opacity bg-neutral-700 bg-opacity-75" aria-hidden="true"></div>
      
      <!-- 模态框内容 -->
      <div class="inline-block overflow-hidden text-left align-bottom transition-all transform bg-white rounded-xl shadow-xl sm:my-8 sm:align-middle sm:max-w-3xl sm:w-full">
        <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
          <div class="sm:flex sm:items-start">
            <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
              <div class="flex justify-between items-start mb-4">
                <h3 class="text-lg font-medium leading-6 text-neutral-900" id="modal-title">
                  求片详情
                </h3>
                <button type="button" id="close-modal" class="text-neutral-400 hover:text-neutral-500 focus:outline-none">
                  <i class="fa fa-times"></i>
                </button>
              </div>
              
              <div id="detail-content" class="flex flex-col md:flex-row gap-6">
                <!-- 详情内容将通过JavaScript动态加载 -->
                <div class="w-full text-center py-10">
                  <div class="loading mx-auto"></div>
                  <p class="mt-2 text-neutral-500">加载详情中...</p>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="bg-neutral-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
          <button type="button" id="close-detail" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-primary text-base font-medium text-white hover:bg-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary sm:ml-3 sm:w-auto sm:text-sm">
            关闭
          </button>
        </div>
      </div>
    </div>
  </div>
  
  <!-- 新建请求模态框 -->
  <div id="new-request-modal" class="fixed inset-0 z-50 hidden overflow-y-auto">
    <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
      <!-- 背景遮罩 -->
      <div class="fixed inset-0 transition-opacity bg-neutral-700 bg-opacity-75" aria-hidden="true"></div>
      
      <!-- 模态框内容 -->
      <div class="inline-block overflow-hidden text-left align-bottom transition-all transform bg-white rounded-xl shadow-xl sm:my-8 sm:align-middle sm:max-w-2xl sm:w-full">
        <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
          <div class="sm:flex sm:items-start">
            <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
              <div class="flex justify-between items-start mb-4">
                <h3 class="text-lg font-medium leading-6 text-neutral-900">
                  在线立即求片
                </h3>
                <button type="button" id="close-new-request" class="text-neutral-400 hover:text-neutral-500 focus:outline-none">
                  <i class="fa fa-times"></i>
                </button>
              </div>
              
              <form id="request-form">
                <div class="space-y-4">
                  <div>
                    <label for="movie-title" class="block text-sm font-medium text-neutral-700 mb-1">影片名称 <span class="text-red-500">*</span></label>
                    <input type="text" id="movie-title" name="name" placeholder="请输入影片名称"
                           class="w-full py-2.5 px-4 rounded-lg bg-white/70 border border-neutral-200 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition-all">
                    <p class="error-message text-red-500 text-xs mt-1 hidden"></p>
                  </div>
                  
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label for="movie-type" class="block text-sm font-medium text-neutral-700 mb-1">影片类型 <span class="text-red-500">*</span></label>
                      <select id="movie-type" name="movie-type"
                              class="w-full py-2.5 px-4 rounded-lg bg-white/70 border border-neutral-200 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition-all">
                        <option value="">请选择类型</option>
                        <option value="1">电影</option>
                        <option value="2">电视剧</option>
                        <option value="3">纪录片</option>
                        <option value="4">动漫</option>
                        <option value="5">其他</option>
                      </select>
                      <p class="error-message text-red-500 text-xs mt-1 hidden"></p>
                    </div>
                    
                    <div>
                      <label for="movie-year" class="block text-sm font-medium text-neutral-700 mb-1">上映年份</label>
                      <input type="text" id="movie-year" name="movie-year" placeholder="例如：2023"
                             class="w-full py-2.5 px-4 rounded-lg bg-white/70 border border-neutral-200 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition-all">
                    </div>
                  </div>
                  
                  <div>
                    <label for="movie-description" class="block text-sm font-medium text-neutral-700 mb-1">影片描述</label>
                    <textarea id="movie-description" name="movie-description" rows="2" placeholder="请简要描述影片内容、导演、主演等信息（选填）"
                              class="w-full py-2.5 px-4 rounded-lg bg-white/70 border border-neutral-200 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition-all"></textarea>
                  </div>
                  
                  <div>
                    <label for="request-requirements" class="block text-sm font-medium text-neutral-700 mb-1">您的需求 <span class="text-red-500">*</span></label>
                    <textarea id="request-requirements" name="request-requirements" rows="3" placeholder="请说明您对影片的具体要求，如清晰度、字幕、版本等"
                              class="w-full py-2.5 px-4 rounded-lg bg-white/70 border border-neutral-200 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition-all"></textarea>
                    <p class="error-message text-red-500 text-xs mt-1 hidden"></p>
                  </div>
                  
                  <div class="flex items-start">
                    <div class="flex items-center h-5">
                      <input id="terms" name="terms" type="checkbox" class="w-4 h-4 text-primary focus:ring-primary border-neutral-300 rounded">
                    </div>
                    <div class="ml-3 text-sm">
                      <label for="terms" class="text-neutral-600">我已阅读并同意<a href="../agreement.html" class="text-primary hover:text-dark">《用户求片协议》</a></label>
                      <p class="error-message text-red-500 text-xs mt-1 hidden"></p>
                    </div>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
        <div class="bg-neutral-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
          <button type="button" id="submit-request" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-primary text-base font-medium text-white hover:bg-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary sm:ml-3 sm:w-auto sm:text-sm">
            <span id="submit-text">提交请求</span>
            <div id="submit-loading" class="loading ml-2 hidden"></div>
          </button>
          <button type="button" id="cancel-new-request" class="mt-3 w-full inline-flex justify-center rounded-md border border-neutral-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-neutral-700 hover:bg-neutral-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary sm:mt-0 sm:w-auto sm:text-sm">
            取消
          </button>
        </div>
      </div>
    </div>
  </div>
  
  <!-- 通知提示框 -->
  <div id="notification" class="fixed top-4 right-4 z-50 px-4 py-3 rounded-lg shadow-lg transform translate-x-full transition-transform duration-300 flex items-center">
    <i id="notification-icon" class="mr-2 text-xl"></i>
    <span id="notification-message"></span>
  </div>
  
  <!-- JavaScript -->
  <script>
    // 全局变量
    let currentPage = 1;
    const pageSize = 9;
    let hasMore = true;
    
    // DOM元素
    const requestListEl = document.getElementById('request-list');
    const loadingIndicator = document.getElementById('loading-indicator');
    const emptyState = document.getElementById('empty-state');
    const errorState = document.getElementById('error-state');
    const recordCountEl = document.getElementById('record-count');
    const loadMoreBtn = document.getElementById('load-more-btn');
    const searchInput = document.getElementById('search-input');
    const searchBtn = document.getElementById('search-btn');
    const statusFilter = document.getElementById('status-filter');
    const typeFilter = document.getElementById('type-filter');
    const sortFilter = document.getElementById('sort-filter');
    const retryBtn = document.getElementById('retry-btn');
    
    // 模态框元素
    const detailModal = document.getElementById('detail-modal');
    const closeModal = document.getElementById('close-modal');
    const closeDetail = document.getElementById('close-detail');
    const detailContent = document.getElementById('detail-content');
    const newRequestModal = document.getElementById('new-request-modal');
    const newRequestBtn = document.getElementById('new-request-btn');
    const closeNewRequest = document.getElementById('close-new-request');
    const cancelNewRequest = document.getElementById('cancel-new-request');
    const requestForm = document.getElementById('request-form');
    const submitRequest = document.getElementById('submit-request');
    const submitText = document.getElementById('submit-text');
    const submitLoading = document.getElementById('submit-loading');
    
    // 通知元素
    const notification = document.getElementById('notification');
    const notificationIcon = document.getElementById('notification-icon');
    const notificationMessage = document.getElementById('notification-message');
    
    // 初始化页面
    document.addEventListener('DOMContentLoaded', () => {
      // 加载求片记录
      loadRequests();
      
      // 绑定事件
      bindEvents();
      
      // 初始化动画
      const cards = document.querySelectorAll('.card-hover');
      cards.forEach((card, index) => {
        setTimeout(() => {
          card.classList.add('fade-in');
        }, 100 * index);
      });
    });
    
    // 绑定所有事件
    function bindEvents() {
      // 搜索和筛选事件
      searchBtn.addEventListener('click', () => {
        resetPagination();
        loadRequests();
      });
      
      searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          resetPagination();
          loadRequests();
        }
      });
      
      statusFilter.addEventListener('change', () => {
        resetPagination();
        loadRequests();
      });
      
      typeFilter.addEventListener('change', () => {
        resetPagination();
        loadRequests();
      });
      
      sortFilter.addEventListener('change', () => {
        resetPagination();
        loadRequests();
      });
      
      // 加载更多
      loadMoreBtn.addEventListener('click', loadMoreRequests);
      
      // 重试按钮
      retryBtn.addEventListener('click', () => {
        resetPagination();
        loadRequests();
      });
      
      // 详情模态框控制
      [closeModal, closeDetail].forEach(button => {
        button.addEventListener('click', () => {
          detailModal.classList.add('hidden');
          document.body.style.overflow = '';
        });
      });
      
      // 点击模态框外部关闭
      detailModal.addEventListener('click', (e) => {
        if (e.target === detailModal) {
          detailModal.classList.add('hidden');
          document.body.style.overflow = '';
        }
      });
      
      // 新建请求模态框控制
      newRequestBtn.addEventListener('click', () => {
        newRequestModal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
        // 重置表单
        requestForm.reset();
        hideAllErrors();
      });
      
      [closeNewRequest, cancelNewRequest].forEach(button => {
        button.addEventListener('click', () => {
          newRequestModal.classList.add('hidden');
          document.body.style.overflow = '';
        });
      });
      
      // 点击模态框外部关闭
      newRequestModal.addEventListener('click', (e) => {
        if (e.target === newRequestModal) {
          newRequestModal.classList.add('hidden');
          document.body.style.overflow = '';
        }
      });
      
      // 提交请求
      submitRequest.addEventListener('click', submitNewRequest);
    }
    
    // 重置分页
    function resetPagination() {
      currentPage = 1;
      hasMore = true;
      requestListEl.innerHTML = '';
      loadMoreBtn.classList.remove('hidden');
    }
    
    // 加载求片记录
    function loadRequests(isLoadMore = false) {
      // 显示加载状态
      if (!isLoadMore) {
        requestListEl.innerHTML = '';
        loadingIndicator.classList.remove('hidden');
        emptyState.classList.add('hidden');
        errorState.classList.add('hidden');
      } else {
        loadMoreBtn.innerHTML = '<div class="loading mr-2"></div><span>加载中...</span>';
        loadMoreBtn.disabled = true;
      }
      
      // 获取搜索和筛选参数
      const searchParams = {
        keyword: searchInput.value.trim(),
        status: statusFilter.value,
        type: typeFilter.value,
        sort: sortFilter.value,
        page: currentPage,
        pageSize: pageSize
      };
        // 将参数转换为查询字符串
  const queryString = new URLSearchParams();
  Object.entries(searchParams).forEach(([key, value]) => {
    if (value) { // 只添加有值的参数
      queryString.append(key, value);
    }
  });
      // 调用API加载数据
 //     fetch('/ajax/qiupianlist', {
   fetch(`/ajax/qiupianlist?${queryString.toString()}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          // 可以添加认证信息
          // 'Authorization': 'Bearer ' + getToken()
        },
        // 将参数转换为查询字符串
        body: null,
        query: searchParams // 实际项目中需要将参数转换为URL查询字符串
      })
      .then(response => {
        if (!response.ok) {
          throw new Error('网络响应不正常');
        }
        return response.json();
      })
      .then(data => {
        // 隐藏加载状态
        loadingIndicator.classList.add('hidden');
        loadMoreBtn.innerHTML = '<i class="fa fa-refresh mr-2"></i><span>加载更多</span>';
        loadMoreBtn.disabled = false;
        
        // 更新记录总数
        recordCountEl.textContent = `共 ${data.total} 条记录`;
        
        // 处理返回的数据
        if (data.data && data.data.length > 0) {
          // 渲染请求列表
          renderRequests(data.data, isLoadMore);
          
          // 检查是否还有更多数据
          hasMore = currentPage * pageSize < data.total;
          if (!hasMore) {
            loadMoreBtn.classList.add('hidden');
          }
          
          // 增加页码
          currentPage++;
        } else {
          // 没有数据
          if (!isLoadMore) {
            emptyState.classList.remove('hidden');
          } else {
            showNotification('没有更多数据了', 'info');
          }
          loadMoreBtn.classList.add('hidden');
        }
      })
      .catch(error => {
        console.error('加载求片记录失败:', error);
        loadingIndicator.classList.add('hidden');
        loadMoreBtn.innerHTML = '<i class="fa fa-refresh mr-2"></i><span>加载更多</span>';
        loadMoreBtn.disabled = false;
        
        if (!isLoadMore) {
          errorState.classList.remove('hidden');
        } else {
          showNotification('加载失败，请重试', 'error');
        }
      });
    }
    
    // 加载更多求片记录
    function loadMoreRequests() {
      if (hasMore) {
        loadRequests(true);
      }
    }
    
    // 渲染求片记录
    function renderRequests(requests, isLoadMore) {
      requests.forEach((request, index) => {
        // 创建求片项目元素
        const requestEl = document.createElement('div');
        requestEl.className = 'glass rounded-xl overflow-hidden shadow-sm hover:shadow-md transition-all card-hover group';
        requestEl.dataset.id = request.id;
        
        // 根据状态设置不同的样式和内容
        let statusBadge = '';
        let statusColor = '';
        let statusText = '';
        let actionText = '';
        let actionIcon = '';
        let completionText = '';
        switch(request.status) {
          case 1:
            statusBadge = '<span class="px-2.5 py-1 rounded-full text-xs bg-blue-500 text-white">处理中</span>';
            statusColor = 'text-blue-400';
            statusText = `60%`;
            actionText = '查看详情';
            actionIcon = 'fa-angle-right';
            completionText = `预计完成: ${request.expectedCompletion}`;
            break;
          case 2:
            statusBadge = `
              <span class="px-2.5 py-1 rounded-full text-xs bg-green-500 text-white">已完成</span>
             
            `;
            statusColor = 'text-green-500';
            statusText = '100%';
            actionText = '处理完成';
            actionIcon = 'fa-play';
            completionText = `耗时: ${request.processingDays} 天`;
            break;
          case 3:
            statusBadge = '<span class="px-2.5 py-1 rounded-full text-xs bg-red-500 text-white">已拒绝</span>';
            statusColor = 'text-red-500';
            statusText = '已拒绝';
            actionText = '查看详情';
            actionIcon = 'fa-angle-right';
            completionText = `原因: ${request.reason || '未说明'}`;
            break;
        }
        
        // 设置元素内容
        requestEl.innerHTML = `
          <div class="relative">
            <img src="${request.img || 'https://picsum.photos/id/' + (237 + index) + '/600/400'}" alt="${request.name}" class="w-full h-48 object-cover group-hover:scale-105 transition-transform duration-500 ${request.status === 3 ? 'opacity-80' : ''}">
            <div class="absolute top-3 left-3">
              ${statusBadge}
            </div>
            <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 to-transparent p-4">
              <span class="text-white text-xs">${request.status === 2 ? '完成于' : '请求于'} ${request.data}</span>
            </div>
          </div>
          <div class="p-4">
            <div class="flex justify-between items-start mb-2">
              <h3 class="font-bold text-lg group-hover:text-primary transition-colors">${request.name}</h3>
              <span class="text-xs text-neutral-500">#${request.number}</span>
            </div>
            <p class="text-neutral-500 text-sm mb-3">${request.category}</p>
            
            <div class="mb-3">
              <div class="flex justify-between text-xs mb-1">
                <span class="text-neutral-500">${request.status === 3 ? '处理状态' : '处理进度'}</span>
                <span class="${statusColor}">${statusText}</span>
              </div>
              <div class="w-full bg-neutral-200 rounded-full h-1.5">
                <div class="${request.status === 1 ? 'bg-blue-500' : request.status === 2 ? 'bg-green-500' : 'bg-red-500'} h-1.5 rounded-full" style="width: ${request.status === 3 ? '100%' : request.progress || 100}%"></div>
              </div>
            </div>
            
            <div class="flex justify-between items-center">
              <span class="text-xs text-neutral-500">${completionText}</span>
              <button class="view-detail text-primary hover:text-dark text-sm font-medium transition-colors flex items-center" data-id="${request.id}">
                ${actionText} <i class="fa ${actionIcon} ml-1"></i>
              </button>
            </div>
          </div>
        `;
        
        // 添加到列表
        requestListEl.appendChild(requestEl);
        
        // 添加动画
        setTimeout(() => {
          requestEl.classList.add('fade-in');
        }, 100 * index);
        
        // 绑定查看详情事件
        requestEl.querySelector('.view-detail').addEventListener('click', () => {
          viewRequestDetail(request.id);
        });
      });
    }
    
    // 查看求片详情
    function viewRequestDetail(id) {
      // 显示模态框和加载状态
      detailModal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      detailContent.innerHTML = `
        <div class="w-full text-center py-10">
          <div class="loading mx-auto"></div>
          <p class="mt-2 text-neutral-500">加载详情中...</p>
        </div>
      `;
      
      // 调用API获取详情
      fetch(`/ajax/qiupianx/?id=${id}`, {
        method: 'GET',
        headers: {
          'Content-Type': 'application/json',
          // 'Authorization': 'Bearer ' + getToken()
        }
      })
      .then(response => {
        if (!response.ok) {
          throw new Error('获取详情失败');
        }
        return response.json();
      })
      .then(result => {
        if (!result || result.code !== 0) {
          throw new Error((result && (result.message || result.msg)) || '获取详情失败');
        }
        renderRequestDetail(result.data || {});
      })
      .catch(error => {
        console.error('加载详情失败:', error);
        detailContent.innerHTML = `
          <div class="w-full text-center py-10">
            <i class="fa fa-exclamation-circle text-5xl text-red-400 mb-3"></i>
            <p class="text-neutral-500 mb-2">加载详情失败</p>
            <button class="text-primary hover:text-dark text-sm font-medium transition-colors" onclick="viewRequestDetail(${id})">
              重试
            </button>
          </div>
        `;
      });
    }
    
    // 渲染求片详情
    function renderRequestDetail(data) {
      let statusBadge = '';
      switch(data.status) {
        case 1:
          statusBadge = '<span class="px-2 py-1 rounded-full text-xs bg-blue-100 text-blue-800">处理中</span>';
          break;
        case 2:
          statusBadge = '<span class="px-2 py-1 rounded-full text-xs bg-green-100 text-green-800">已完成</span>';
          break;
        case 3:
          statusBadge = '<span class="px-2 py-1 rounded-full text-xs bg-red-100 text-red-800">已拒绝</span>';
          break;
      }
      
      // 构建处理日志HTML
      let logsHtml = '';
      const processingLogs = Array.isArray(data.processingLogs) ? data.processingLogs : [];
      processingLogs.forEach(log => {
        logsHtml += `
          <div class="flex">
            <div class="flex-shrink-0 w-6 h-6 rounded-full bg-primary/20 flex items-center justify-center text-primary text-xs mt-0.5">
              <i class="fa ${log.icon || 'fa-check'}"></i>
            </div>
            <div class="ml-3">
              <p class="text-neutral-700">${log.message}</p>
              <p class="text-neutral-500 text-xs mt-0.5">${log.time}</p>
            </div>
          </div>
        `;
      });
      
      // 设置详情内容
      detailContent.innerHTML = `
        <!-- 影片信息 -->
        <div class="md:w-1/3">
          <img src="${data.img || 'https://picsum.photos/id/237/300/450'}" alt="${data.name}封面" class="w-full rounded-lg shadow-md">
          <div class="mt-4">
            <div class="flex justify-between items-center mb-2">
              <span class="text-sm text-neutral-500">状态</span>
              ${statusBadge}
            </div>
            <div class="flex justify-between items-center mb-2">
              <span class="text-sm text-neutral-500">请求ID</span>
              <span class="text-sm font-medium">#${data.number}</span>
            </div>
            <div class="flex justify-between items-center mb-2">
              <span class="text-sm text-neutral-500">请求时间</span>
              <span class="text-sm">${data.time}</span>
            </div>
            ${data.status !== 3 ? `
              <div class="flex justify-between items-center mb-2">
                <span class="text-sm text-neutral-500">${data.status === 2 ? '完成时间' : '预计完成'}</span>
                <span class="text-sm">${data.status === 2 ? data.completion_time : data.expectedCompletion}</span>
              </div>
            ` : ''}
            <div class="mt-4">
              <div class="flex justify-between text-sm mb-1">
                <span class="text-neutral-500">${data.status === 3 ? '处理状态' : '处理进度'}</span>
                <span class="${data.status === 1 ? 'text-blue-500' : data.status === 2 ? 'text-green-500' : 'text-red-500'}">${data.status === 3 ? '已拒绝' : data.progress+ '%'}</span>
              </div>
              <div class="w-full bg-neutral-200 rounded-full h-2">
                <div class="${data.status === 1 ? 'bg-blue-500' : data.status === 2 ? 'bg-green-500' : 'bg-red-500'} h-2 rounded-full" style="width: ${data.status === 3 ? '100%' : data.progress}%"></div>
              </div>
            </div>
          </div>
        </div>
        
        <!-- 详情信息 -->
        <div class="md:w-2/3">
          <h4 class="text-xl font-bold mb-2">${data.name}</h4>
          <p class="text-neutral-500 mb-4">${data.year || ''} /${data.category}</p>
          
          <div class="mb-4">
            <h5 class="font-medium mb-2 text-neutral-700">我的请求说明</h5>
            <p class="text-neutral-600 text-sm bg-neutral-50 p-3 rounded-lg">
              ${data.demand || '无特殊说明'}
            </p>
          </div>
          
          <div class="mb-4">
            <h5 class="font-medium mb-2 text-neutral-700">影片信息</h5>
            <div class="space-y-2">
              ${data.director ? `
                <div class="flex flex-wrap">
                  <span class="text-sm text-neutral-500 w-20 sm:w-24">导演:</span>
                  <span class="text-sm">${data.director}</span>
                </div>
              ` : ''}
              ${data.actors ? `
                <div class="flex flex-wrap">
                  <span class="text-sm text-neutral-500 w-20 sm:w-24">主演:</span>
                  <span class="text-sm">${data.actors}</span>
                </div>
              ` : ''}
              ${data.imdbRating ? `
                <div class="flex flex-wrap">
                  <span class="text-sm text-neutral-500 w-20 sm:w-24">IMDb:</span>
                  <span class="text-sm">${data.imdbRating}</span>
                </div>
              ` : ''}
              ${data.describe ? `
                <div class="flex flex-wrap">
                  <span class="text-sm text-neutral-500 w-20 sm:w-24">简介:</span>
                  <span class="text-sm">${data.describe}</span>
                </div>
              ` : ''}
            </div>
          </div>
          
          ${data.status === 3 && data.reason ? `
            <div class="mb-4">
              <h5 class="font-medium mb-2 text-neutral-700">拒绝原因</h5>
              <p class="text-neutral-600 text-sm bg-neutral-50 p-3 rounded-lg text-red-500">
                ${data.reason}
              </p>
            </div>
          ` : ''}
          
          <div>
            <h5 class="font-medium mb-2 text-neutral-700">处理日志</h5>
            <div class="bg-neutral-50 p-3 rounded-lg text-sm space-y-3">
              ${logsHtml}
            </div>
          </div>
        </div>
      `;
    }
    
    // 提交新请求
    function submitNewRequest() {
      // 表单验证
      if (!validateForm()) {
        return;
      }
      
      // 获取表单数据
      const formData = {
        title: document.getElementById('movie-title').value.trim(),
        type: document.getElementById('movie-type').value,
        year: document.getElementById('movie-year').value.trim(),
        description: document.getElementById('movie-description').value.trim(),
        requirements: document.getElementById('request-requirements').value.trim()
      };
      
      // 显示加载状态
      submitText.textContent = '提交中';
      submitLoading.classList.remove('hidden');
      submitRequest.disabled = true;
      
      // 发送POST请求
      fetch('/ajax/qiupianpost', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          // 'Authorization': 'Bearer ' + getToken()
        },
        body: JSON.stringify(formData)
      })
      .then(response => {
        if (!response.ok) {
          return response.json().then(data => {
            throw new Error(data.message || '提交失败');
          });
        }
        return response.json();
      })
      .then(data => {
        // 提交成功
        showNotification('求片请求提交成功！', 'success');
        
        // 关闭模态框
        newRequestModal.classList.add('hidden');
        document.body.style.overflow = '';
        
        // 重新加载请求列表
        resetPagination();
        loadRequests();
      })
      .catch(error => {
        console.error('提交请求失败:', error);
        showNotification(error.message || '提交失败，请重试', 'error');
      })
      .finally(() => {
        // 恢复按钮状态
        submitText.textContent = '提交请求';
        submitLoading.classList.add('hidden');
        submitRequest.disabled = false;
      });
    }
    
    // 表单验证
    function validateForm() {
      let isValid = true;
      hideAllErrors();
      
      // 验证影片名称
      const title = document.getElementById('movie-title');
      if (!title.value.trim()) {
        showError(title, '请输入影片名称');
        isValid = false;
      }
      
      // 验证影片类型
      const type = document.getElementById('movie-type');
      if (!type.value) {
        showError(type, '请选择影片类型');
        isValid = false;
      }
      
      // 验证需求说明
      const requirements = document.getElementById('request-requirements');
      if (!requirements.value.trim()) {
        showError(requirements, '请说明您的需求');
        isValid = false;
      }
      
      // 验证协议同意
      const terms = document.getElementById('terms');
      if (!terms.checked) {
        showError(terms, '请阅读并同意用户求片协议');
        isValid = false;
      }
      
      return isValid;
    }
    
    // 显示错误信息
    function showError(element, message) {
      const errorElement = element.parentNode.querySelector('.error-message');
      if (errorElement) {
        errorElement.textContent = message;
        errorElement.classList.remove('hidden');
      }
      // 高亮错误字段
      element.classList.add('border-red-500');
      element.addEventListener('input', () => {
        element.classList.remove('border-red-500');
        errorElement.classList.add('hidden');
      }, { once: true });
    }
    
    // 隐藏所有错误信息
    function hideAllErrors() {
      const errorElements = document.querySelectorAll('.error-message');
      errorElements.forEach(el => {
        el.classList.add('hidden');
      });
      
      const inputs = document.querySelectorAll('input, select, textarea');
      inputs.forEach(input => {
        input.classList.remove('border-red-500');
      });
    }
    
    // 显示通知
    function showNotification(message, type = 'info') {
      // 设置通知内容和样式
      notificationMessage.textContent = message;
      
      // 设置图标和颜色
      if (type === 'success') {
        notificationIcon.className = 'fa fa-check-circle text-green-500 mr-2 text-xl';
        notification.className = 'fixed top-4 right-4 z-50 px-4 py-3 rounded-lg shadow-lg bg-green-50 text-green-800 transform translate-x-full transition-transform duration-300 flex items-center';
      } else if (type === 'error') {
        notificationIcon.className = 'fa fa-exclamation-circle text-red-500 mr-2 text-xl';
        notification.className = 'fixed top-4 right-4 z-50 px-4 py-3 rounded-lg shadow-lg bg-red-50 text-red-800 transform translate-x-full transition-transform duration-300 flex items-center';
      } else {
        notificationIcon.className = 'fa fa-info-circle text-primary mr-2 text-xl';
        notification.className = 'fixed top-4 right-4 z-50 px-4 py-3 rounded-lg shadow-lg bg-blue-50 text-blue-800 transform translate-x-full transition-transform duration-300 flex items-center';
      }
      
      // 显示通知
      setTimeout(() => {
        notification.classList.remove('translate-x-full');
      }, 10);
      
      // 3秒后隐藏通知
      setTimeout(() => {
        notification.classList.add('translate-x-full');
      }, 3000);
    }
    
    // 工具函数 - 获取认证令牌（实际项目中实现）
    function getToken() {
      // 这里应该从localStorage或cookie中获取认证令牌
      return '';
    }
  </script>
