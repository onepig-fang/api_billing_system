<include file="/public/header">
<!-- 正文开始 -->
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body">
            <form class="layui-form " id="formBasForm" lay-filter="formBasForm">
                <div class="layui-tab layui-tab-brief" lay-filter="docDemoTabBrief">
     
                    <div class="layui-tab-content" >
                        <div class="layui-tab-item layui-show">
                            <fieldset class="layui-elem-field layui-field-title">
                                <legend>注册配置</legend>
                                <div class="layui-field-box">
                                          <div class="layui-form-item">
                                        <label class="layui-form-label">注册开关</label>
                                        <div class="layui-input-block">
                                          <input name="reg_type" value="0" hidden="">
                                <input type="checkbox" name="reg_type" value="1" lay-skin="switch"  lay-text="开启|关闭"   <if condition="$set['reg_type'] eq 1"> checked </if>>
                                        </div>
                                    </div>
                                    <div class="layui-form-item">
                                        <label class="layui-form-label">赠送点数</label>
                                        <div class="layui-input-block">
                                          <input type="text" name="reg_points" class="layui-input" placeholder="" value="{:isset($set.reg_points) ? $set.reg_points : ''}" required>
                                        </div>
                                    </div>
                
                                </div>
                                
                            </fieldset>
               
                        </div>
           
            
                    </div>
                </div>
                <hr style="width:0px"><hr>
                <div class="layui-form-item layui-row layui-col-space10 ">
                    <div class="layui-col-md2">
                        <button type="submit" class="layui-btn layui-btn-fluid" lay-filter="noticeBtn" lay-submit>保存配置</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<include file="/public/footer">

<script>
    layui.use([ 'layer', 'form', 'admin', 'notice'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var form = layui.form;
        var admin = layui.admin;
        var notice = layui.notice;


        // 表单提交事件
        form.on('submit(noticeBtn)', function (data) {
            notice.msg('正在执行中..', {icon: 4, close: true});
            $.ajax({
                type: "POST",
                url: '{:url("/Set/rededit")}',
                data: data.field,
                dataType: "json",
                success: function(data) {
                    notice.destroy();
                    if (data.code == 0) {
                        notice.msg(data.msg, {icon: 1, audio:'1'});
                    } else {
                        notice.msg(data.msg, {icon: 2, audio:'1'});
                    }
                },
                error: function() {
                    notice.destroy();
                    notice.msg("服务器错误！", {icon: 2, audio:'1'});
                }
            });
            return false;
        });
  
    });
</script>
